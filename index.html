  const confLabel = _notRun ? 'not run'
    : confidence === 'mechanical' ? 'measured' : confidence === 'visual' ? 'seen'
    : confidence === 'limited' ? 'limited' : confidence === 'judgment' ? 'opinion'
    // 'observation' had no entry, so Market & offer read rendered with NO badge
    // while the ten rows around it carried one - it looked unclassified rather
    // than deliberately an observation, which is exactly what it is.
    : confidence === 'observation' ? 'observed' : '';
  return React.createElement('div', { style: { borderBottom: isLast ? 'none' : '1px solid var(--b)' } },
    React.createElement('div', {
      onClick: () => setExpanded(!expanded),
      style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '9px 14px', cursor: 'pointer', background: expanded ? 'var(--s)' : 'transparent' }
    },
      React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 7 } },
        React.createElement('span', { style: { fontSize: 12, color: 'var(--t)' } }, label),
        confLabel && React.createElement('span', { style: { fontSize: 9, padding: '1px 5px', borderRadius: 8, border: '1px solid ' + confColor, color: confColor, letterSpacing: '.03em', textTransform: 'uppercase', fontWeight: 600 } }, confLabel)
      ),
      React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
        React.createElement('span', { style: { fontSize: 12, color: 'var(--m2)' } }, val || 'Not checked'),
        React.createElement('span', { style: { width: 6, height: 6, borderRadius: '50%', background: ok ? 'var(--g)' : ok === false ? 'var(--r)' : 'var(--am)', flexShrink: 0 } }),
        React.createElement('span', { style: { fontSize: 10, color: 'var(--m)', transform: expanded ? 'rotate(90deg)' : 'none', display: 'inline-block', transition: 'transform .15s' } }, '▶')
      )
    ),
    expanded && React.createElement('div', { style: { padding: '10px 14px 12px', background: 'var(--s)', borderTop: '1px solid var(--b)' } },
      React.createElement('div', { style: { fontSize: 10, fontWeight: 700, letterSpacing: '.07em', textTransform: 'uppercase', color: 'var(--m)', marginBottom: 6 } }, 'How we checked'),
      React.createElement('div', { style: { fontSize: 12, color: 'var(--m2)', lineHeight: 1.6, marginBottom: 8 } }, proof),
      React.createElement('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 4 } },
        (tags || []).map(t => React.createElement('span', { key: t, style: { fontSize: 10, padding: '2px 7px', borderRadius: 10, border: '1px solid var(--b)', color: 'var(--m2)', background: 'var(--s2)' } }, t))
      )
    )
  );
}

// ══ THE AUDIT, IN ONE PLACE ══════════════════════════════════════════════════
// Every signal the audit measured, curated, with the evidence behind each one.
// This was written inline inside the Research tab, so the call sheet could not
// reach it and instead reassembled findings from buckets, richData, brainAudit
// and raw structured fields \u2014 five sources, each one incomplete, patched one at
// a time as each gap surfaced.
//
// One function, two consumers. The Research tab renders these as rows; the call
// sheet turns them into things to say. Neither can now know something the other
// does not, and a new signal added here appears in both without further work.
function buildAuditRows(lead) {
  if (!lead) return [];
  return [

    // ══ TIER 1 — CAN CUSTOMERS FIND THEM? Top of the revenue funnel and the
    //    highest-leverage findings we can make. Measured, and the owner can verify
    //    each in seconds. These lead the audit and should lead the email.
    (() => {
      // LOCAL SEARCH RANK. The pitch was already built on this — "#17 in Concord for
      // concrete lifting, invisible for crawl space cleanout" — but the evidence had
      // no row, so the one claim most likely to make an owner sit up was the one
      // claim he could not click into. Mechanical: we ran the search and read the
      // position. No inference about traffic, spend or cause.
      const lv = lead.localVisibility;
      if (!lv || !lv.checked) {
        return { label: 'Local search rank', confidence: 'mechanical', val: 'Not checked', ok: false,
          proof: lv && lv.why ? ('Not measured: ' + lv.why + ' We make no claim about where this business ranks.')
                              : 'This lead was researched before the local-rank check existed, or it did not run. We make no claim about where they appear in local search. Re-run Research to check.',
          tags: ['Not checked', 'No claim made'] };
      }
      const invis = (lv.invisible || []).length;
      const svcInvis = (lv.invisible || []).filter(r => r.kind === 'their own service page');
      const best = lv.ranked && lv.ranked.length ? lv.ranked[0] : null;
      const val = invis
        ? ('Invisible for ' + invis + ' of ' + lv.totalChecked + ' searches' + (best ? ' · best rank #' + best.rank : ''))
        : (best ? ('Ranks #' + best.rank + ' for "' + best.phrase + '"') : 'Checked');
      return {
        label: 'Local search rank', confidence: 'mechanical',
        val, ok: invis === 0 && !!best && best.rank <= 3,
        proof: 'Searched Google local results for each phrase a customer in ' + (((lv.results || [])[0] || {}).city || 'their city') + ' would actually type, and read the position back. Service keywords come from their OWN sitemap — every one is a page they publish.'
          + (svcInvis.length ? ' They do not appear at all for: ' + svcInvis.map(r => '"' + r.phrase + '"').join(', ') + '.' : '')
          + (best && best.weakerAbove ? ' ' + best.weakerAbove + ' business(es) ranking above them have FEWER reviews — the reputation is there, the visibility is not.' : '')
          + ' Position only — no claim about their traffic, ad spend, or why they rank where they do.',
        // (lv.results || []).filter(Boolean): a lead persisted by an older build
        // can carry checked:true with no results array, or a null row inside
        // one, and a bare .map here threw — turning that lead into a
        // "could not be rendered" row in the export instead of a partial audit.
        // Found by the export hammer (1,000 randomized shapes), 119 of which
        // came back broken through exactly this line.
        tags: (lv.results || []).filter(Boolean).map(r => r.found ? ('#' + r.rank + ' — ' + r.phrase) : ('absent — ' + r.phrase)),
      };
    })(),
    // GOOGLE BUSINESS PROFILE — free, measured, top of the local revenue funnel.
    // Every gap here is read from their live Google listing, so it is stated as
    // fact and the owner can confirm it in ten seconds on his phone.
    (() => {
      const g = lead.gbpHealth;
      if (!g || !g.checked) {
        return { label: 'Google Business Profile', confidence: 'mechanical', val: 'Not checked', ok: false,
          proof: 'Their Google Business Profile was not checked (no place ID, or researched before this signal existed). We make no claim about their listing. Re-run Research to check.',
          tags: ['Not checked', 'No claim made'] };
      }
      return {
        label: 'Google Business Profile', confidence: 'mechanical',
        val: g.gapCount ? (g.gapCount + ' profile gap' + (g.gapCount>1?'s':'') + ' — costing free map-pack traffic') : 'Profile looks complete',
        ok: g.gapCount === 0,
        proof: 'Read directly from their live Google Business Profile via the Places API: '
          + g.photoCount + ' photo(s), hours ' + (g.hasHours?'listed':'MISSING') + ', description ' + (g.hasDescription?'present':'MISSING') + ', website link ' + (g.hasWebsiteLink?'present':'MISSING') + '. '
          + (g.gapCount ? 'Observed gaps: ' + g.gaps.join('; ') + '. Each is measured, not inferred — the owner can confirm it by opening his own listing. An incomplete profile is the single most common reason a good local business loses map-pack visibility to a worse competitor.' : 'No profile gaps found — do not invent one.'),
        tags: g.gaps && g.gaps.length ? g.gaps.map(x => x.split(' on their')[0].slice(0,28)) : ['Complete'],
      };
    })(),
    // MARKET & OFFER — Hormozi's highest-leverage layer, read as an OBSERVATION
    // from their homepage copy (not a score). Market > offer > persuasion.
    (() => {
      const pr = lead.positioningRead;
      if (!pr || !pr.observation) {
        return { label: 'Market & offer read', confidence: 'observation', val: 'Not assessed', ok: true,
          proof: 'Their homepage copy was not captured, so no positioning observation was made. No claim is stated about who they target or their offer.',
          tags: ['Not assessed'] };
      }
      const weak = (pr.targetsSpecificCustomer === false) || (pr.hasRealOffer === false);
      return {
        label: 'Market & offer read', confidence: 'observation',
        val: weak
          ? ((pr.targetsSpecificCustomer === false && pr.hasRealOffer === false) ? 'Generic targeting + no clear offer'
             : pr.targetsSpecificCustomer === false ? 'Targets everyone — no specific customer'
             : 'No real offer — generic CTA')
          : 'Specific target + real offer',
        ok: !weak,
        proof: pr.observation
          + (pr.repeatedGenericPromise ? ' \u2014 The same interchangeable line appears across multiple pages: "' + pr.repeatedGenericPromise + '". That is checkable in thirty seconds and is the sharpest positioning finding available.' : '')
          + (pr.hasGuarantee === false ? ' No guarantee or risk reversal is visible on the pages we read \u2014 per Hormozi the single biggest lever on whether a stranger believes it will work for them.' : '')
          + ' — This is an OBSERVATION from their own site copy, not a score or a dollar figure. Per Hormozi, market and offer are the highest-leverage levers a business has (market > offer > persuasion), so a weak read here is often the most important thing to raise — framed as what their site says, which the owner can read himself.',
        tags: [
          pr.targetsSpecificCustomer === false ? 'Targets everyone' : 'Specific target',
          pr.hasRealOffer === false ? 'No clear offer' : 'Has an offer',
          pr.hasGuarantee === false ? 'No guarantee' : (pr.hasGuarantee === true ? 'Has guarantee' : null),
          pr.offerIsNamed === false ? 'Offer unnamed' : null,
          pr.repeatedGenericPromise ? 'Same promise repeats' : null,
          'Observation, not a score',
        ].filter(Boolean),
      };
    })(),
    // (a second comma sat here, leaving a HOLE in the array. map and filter both
    //  skip holes so nothing broke, but rows.length read 12 while eleven
    //  rendered - so any code trusting the count was quietly wrong.)
    // ══ TIER 2 — DOES THE VISITOR CONVERT? Measured conversion leaks the owner
    //    feels directly: speed/mobile/capture friction, a missing CTA, stale reviews.
    // SITE TECHNICALS — HTTPS, mobile viewport, tap-to-call, form length. Every
    // value read from the page's own HTML, so each is a fact the owner can confirm.
    (() => {
      const h = lead.htmlSignals;
      if (!h || !h.checked) {
        return { label: 'Site technicals', confidence: 'mechanical', val: 'Not checked', ok: false,
          proof: 'Homepage HTML was not captured (site blocked the scrape, or researched before this signal existed). We make no claim about their SSL, mobile setup, or form.',
          tags: ['Not checked', 'No claim made'] };
      }
      const issues = [];
      if (h.isHttps === false) issues.push('no HTTPS/SSL');
      if (h.hasViewport === false) issues.push('no mobile viewport');
      if (h.hasTelLink === false) issues.push('no tap-to-call');
      if (h.hasForm && h.formFieldCount >= 8) issues.push(h.formFieldCount + '-field form');
      if (h.hasTitle === false) issues.push('no title tag');
      if (h.hasMetaDescription === false) issues.push('no meta description');
      return {
        label: 'Site technicals', confidence: 'mechanical',
        val: issues.length ? (issues.length + ' issue' + (issues.length>1?'s':'') + ' — ' + issues.slice(0,2).join(', ')) : 'Clean',
        ok: issues.length === 0,
        proof: 'Read from their homepage HTML: HTTPS ' + (h.isHttps === true ? 'yes' : (h.isHttps === false ? 'NO' : 'not conclusively checked \u2014 no claim made')) + ', mobile viewport ' + (h.hasViewport?'yes':'NO') + ', tap-to-call ' + (h.hasTelLink?'yes':'NO') + ', form fields ' + (h.hasForm ? h.formFieldCount : 'no form') + ', title ' + (h.hasTitle?'yes':'NO') + ', meta description ' + (h.hasMetaDescription?'yes':'NO') + '. '
          + (issues.length ? 'Each issue is measured from their own source and directly affects whether a visitor becomes a customer.' : 'No technical conversion leaks found — do not invent one.'),
        tags: issues.length ? issues.slice(0,4) : ['Clean'],
      };
    })(),
    {
      label: 'CTA above fold', confidence: lead.visionAudit ? 'visual' : 'limited',
      val: lead.buckets?.CONVERSION?.hasCTA || 'Not checked',
      ok: !!(lead.buckets?.CONVERSION?.hasCTA && !/No |not detected/i.test(lead.buckets.CONVERSION.hasCTA)),
      proof: lead.visionAudit ? ('Vision looked at the actual rendered homepage screenshot. ' + (lead.visionAudit.hasVisibleCTA ? ('CTA visible: "' + (lead.visionAudit.ctaObserved||'') + '"') : 'No clear call-to-action button visible above the fold.') + (lead.visionAudit.heroIsBlank ? ' The hero area appears blank or broken.' : '')) : 'Scanned homepage source for action-text buttons/links above the fold. JS-rendered CTAs may not be detected — run with a screenshot for a visual check.',
      tags: ['Homepage scanned', 'Action text check', 'Button/link detection']
    },
    // REVIEW RECENCY — from the newest review's date on their live profile.
    (() => {
      const r = lead.gbpHealth && lead.gbpHealth.reviewRecency;
      if (!r || !r.checked) {
        return { label: 'Review recency', confidence: 'mechanical', val: 'Not checked', ok: true,
          proof: 'We did not measure how recent their reviews are for this lead. No claim is made about review freshness.',
          tags: ['Not checked'] };
      }
      return {
        label: 'Review recency', confidence: 'mechanical',
        val: r.veryCold ? ('Newest review ~' + r.newestDays + ' days old') : (r.stale ? ('Newest ~' + r.newestDays + ' days old') : 'Recent'),
        ok: !r.stale,
        proof: 'The newest Google review on their profile is about ' + r.newestDays + ' days old, measured from its publish date. '
          + (r.veryCold ? 'Buyers read recency as "are people still going here?" — a profile frozen months ago quietly costs trust while someone is deciding.' : (r.stale ? 'Slightly stale but not alarming.' : 'Reviews are current — no staleness claim should be made.')),
        tags: r.veryCold ? ['Stale — ' + r.newestDays + 'd'] : (r.stale ? ['Aging'] : ['Recent']),
      };
    })(),
    // ══ TIER 3 — SUPPORTING CONTEXT. Real checks, but weaker signals an owner does
    //    not feel as revenue. Kept for evidence and transparency, ranked last on
    //    purpose so they never bury a Tier 1 finding.
    {
      label: 'Social proof', confidence: lead.visionAudit ? 'visual' : 'limited',
      val: lead.buckets?.CONVERSION?.socialProof || 'Not checked',
      ok: !!(lead.buckets?.CONVERSION?.socialProof && !/No |not detected|none/i.test(lead.buckets.CONVERSION.socialProof)),
      proof: 'Scanned page for testimonials, review counts, client logo strips, star ratings, and case study links.',
      tags: ['Testimonials — checked', 'Logo strips — checked', 'Review scores — checked']
    },
    {
      label: 'Tracking / analytics', confidence: 'mechanical',
      val: lead.buckets?.INFRASTRUCTURE?.trackingPixel || 'Not checked',
      ok: !!(lead.buckets?.INFRASTRUCTURE?.trackingPixel && !/No |not detected/i.test(lead.buckets.INFRASTRUCTURE.trackingPixel)),
      proof: 'Checked for GA4, Google Tag Manager, Hotjar, Mixpanel, Segment, Clarity, and other analytics tools in page source.',
      tags: ['GA4 — checked', 'GTM — checked', 'Hotjar/Mixpanel — checked']
    },
    {
      label: 'CRM', confidence: 'limited',
      val: lead.buckets?.INFRASTRUCTURE?.crm || 'Not checked',
      ok: !!(lead.buckets?.INFRASTRUCTURE?.crm && !/No |not detected/i.test(lead.buckets.INFRASTRUCTURE.crm)),
      proof: 'Scanned page source for known CRM signatures — HubSpot, Salesforce, Pipedrive, Zoho, Keap, ActiveCampaign, and others. Server-side CRMs may not appear in page source.',
      tags: ['HubSpot — checked', 'Salesforce — checked', 'Pipedrive — checked', '12+ CRMs scanned']
    },
    {
      label: 'Conversion pixel', confidence: 'mechanical',
      // Was reading `trackingPixel` - the SAME field as the analytics row above,
      // so both printed "Analytics/pixel present" and the audit reported one
      // measurement as two findings. conversionPixel is measured separately from
      // fbq()/facebook.net/tr and the Google Ads tag; it was just never returned.
      val: lead.buckets?.INFRASTRUCTURE?.conversionPixel || 'Not checked',
      ok: !!(lead.buckets?.INFRASTRUCTURE?.conversionPixel && !/^No |not readable/i.test(lead.buckets.INFRASTRUCTURE.conversionPixel)),
      proof: 'Scanned page source for Meta Pixel (fbq, facebook.net/tr) and Google Tag Manager containers. Server-side pixels may not be detected.',
      tags: ['fbq() — checked', 'facebook.net/tr — checked', 'GTM containers — checked']
    },
    // GOOGLE LOCAL SERVICES ADS — CRO Jungle's strongest capability, so the audit
    // should say plainly whether the prospect is in it. Note the asymmetry: a badge
    // proves participation, but its absence proves nothing, so the "no badge" state
    // is labelled as unknown rather than as "not running".
    (() => {
      const l = lead.lsa || {};
      // A lead researched before LSA existed, or one where the check genuinely did
      // not run, must say so — NOT fall through to "eligible". Claiming eligibility
      // we never determined is the same failure as claiming they have no ads.
      if (!l.status || l.status === 'not_checked') {
        return { label: 'Google LSA', confidence: 'mechanical', val: 'Not checked', ok: false,
          proof: 'This lead was researched before the Local Services Ads check existed, or the check did not run. We make no claim about their LSA eligibility or participation. Re-run Research to check.',
          tags: ['Not checked', 'No claim made'] };
      }
      if (l.status === 'not_eligible') {
        return { label: 'Google LSA', confidence: 'mechanical', val: 'Not an LSA category', ok: false,
          proof: 'Local Services Ads does not cover this business type, so there is nothing to check.',
          tags: ['Not eligible'] };
      }
      if (l.status === 'running_lsa') {
        return { label: 'Google LSA', confidence: 'mechanical', val: 'Running LSA · confirmed', ok: true,
          proof: 'Found "' + (l.marker || 'Google Guaranteed') + '" on their own site — that mark is issued only through Local Services Ads. They are already paying Google per lead.' + (l.evidence ? ' Context: "' + l.evidence + '"' : ''),
          tags: ['LSA-only marker', 'Paying per lead today'] };
      }
      if (l.status === 'eligible_ambiguous_badge') {
        return { label: 'Google LSA', confidence: 'opinion', val: 'Unclear', ok: false,
          proof: 'Their site mentions "' + (l.marker || 'Google Verified') + '", but that wording is also used for free Google Business Profile verification. Not proof of LSA participation either way.',
          tags: ['Eligible category', 'Ambiguous badge wording'] };
      }
      return { label: 'Google LSA', confidence: 'mechanical', val: 'Eligible · participation unknown', ok: false,
        proof: 'This trade is eligible for Local Services Ads. No badge appears on their site, but many advertisers never display one — so we make no claim about whether they run it.',
        tags: ['Eligible category', 'No badge on site', 'No claim made'] };
    })()
  ];
}

function AuditSignals({ lead }) {
  const rows = buildAuditRows(lead);

  // ══ SAY THE VERDICT THE ROWS ALREADY IMPLY ═══════════════════════════════
  // Eleven rows, listed flat, in the order we happened to measure them. On Parke
  // Gordon SEVEN of them read clean — #4 in the map pack, 168 reviews at 4.9,
  // recent, CTA present, social proof present — and the operator has to read all
  // eleven and do the arithmetic himself to reach the one thing that matters:
  // this is a HEALTHY business with a single broken layer.
  //
  // That is the whole diagnosis, it is already computed (growthConstraint), and
  // the screen was making you rebuild it by eye every time. It also directly
  // supports the call: "you have done the hard part, and here is the one thing
  // in the way" is the opening, and it was nowhere on the page.
  //
  // Counted from the SAME rows shown below, so the headline can never disagree
  // with the list under it — the failure mode this whole session kept hitting.
  const _NOT_RUN = /^(not checked|not measured|not assessed|not readable|unknown|n\/a|\u2014|-)\b/i;
  const _counted = rows.filter(r => r && !_NOT_RUN.test(String(r.val || '').trim()));
  const _problems = _counted.filter(r => r.ok === false).length;
  const _clean = _counted.length - _problems;
  const _gc = lead.growthConstraint || (lead.brainAudit && lead.brainAudit.growthConstraint) || null;
  const _layer = _gc && _gc.checked !== false ? (_gc.layer || '') : '';

  return React.createElement('div', null,
    _counted.length >= 5 && React.createElement('div', {
      style: { padding: '11px 14px', marginBottom: 10, borderRadius: 9,
        border: '1px solid var(--b)', background: 'var(--s)' }
    },
      React.createElement('div', { style: { fontSize: 10, fontWeight: 700, letterSpacing: '.07em', textTransform: 'uppercase', color: 'var(--m)', marginBottom: 5 } }, 'What the audit says'),
      React.createElement('div', { style: { fontSize: 13, color: 'var(--t)', lineHeight: 1.55 } },
        _problems === 0
          ? `We measured ${_counted.length} things and found no problems. Nothing here is worth an email \u2014 do not manufacture one.`
          : `${_clean} of ${_counted.length} measured signals are clean. ${_problems === 1 ? 'One is not' : _problems + ' are not'}.`
            + (_layer ? ` The binding constraint is ${_layer}.` : ' No single binding constraint was measurable.')
            + (_problems <= 2 && _clean >= 5
                ? ' This is a business doing most things right with a narrow gap \u2014 lead with the credit, then the gap.'
                : _problems >= 5
                  ? ' The problems span several layers; the email still names only the binding one.'
                  : '')
      )
    ),
    React.createElement('div', { style: { fontSize: 10, fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--m)', marginBottom: 10, paddingBottom: 7, borderBottom: '1px solid var(--b)' } }, 'Audit signals — click any row to see evidence'),
    React.createElement('div', { style: { border: '1px solid var(--b)', borderRadius: 9, overflow: 'hidden', background: 'var(--s2)' } },
      rows.map((row, i) => React.createElement(AuditSignalRow, { key: row.label, ...row, isLast: i === rows.length - 1 }))
    )
  );
}

function ConfirmDeleteModal({ name, onConfirm, onCancel }) {
  return React.createElement('div', {
    style: { position:'fixed', inset:0, background:'rgba(0,0,0,.72)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:2000 },
    onClick: onCancel
  },
    React.createElement('div', {
      style: { background:'var(--s)', border:'1px solid var(--b2)', borderRadius:14, padding:'26px 30px', maxWidth:400, width:'90%' },
      onClick: e => e.stopPropagation()
    },
      React.createElement('div', { style:{ fontWeight:600, fontSize:16, marginBottom:10 } }, 'Remove lead'),
      React.createElement('div', { style:{ fontSize:13.5, color:'var(--m2)', lineHeight:1.55, marginBottom:22 } },
        'Permanently remove ', React.createElement('strong', null, name), ' from your pipeline? This cannot be undone.'
      ),
      React.createElement('div', { style:{ display:'flex', gap:10, justifyContent:'flex-end' } },
        React.createElement('button', { className:'btn btn-g btn-sm', onClick:onCancel }, 'Cancel'),

      )

// ══ THE BRIEFING — WHAT THE RESEARCH TAB SHOULD HAVE BEEN ════════════════════
// The old Overview was a pitch line, a paragraph, and a product recommendation.
// It answered "what do we sell them" before it answered "what is going on here",
// which is backwards for the person reading it — Mike, a cold caller, or anyone
// handed the lead cold. They need to understand the BUSINESS in six minutes.
//
// Reading order is deliberate and it is the whole design:
//   1. Contact      — what gets used first, so it never needs hunting
//   2. The verdict  — one sentence naming what is actually going on
//   3. Each signal  — what it says ALONE, in plain English, no bare scores
//   4. Do not say   — every flagged claim, so nobody repeats one on a call
//
// No raw numbers without their meaning. "Signal 78" told a reader nothing; "#8 of
// 20 — on the list, near the middle, and 3 of the 7 above have fewer reviews"
// tells them everything. Anyone who has never seen this app can read it cold.
function LeadBriefing({ lead }) {
  if (!lead) return null;
  const ba = lead.brainAudit || {};
  const gc = lead.growthConstraint || ba.growthConstraint || null;
  const sr = lead.situationRead || ba.situationRead || null;
  const rows = buildAuditRows(lead);
  const NOT_RUN = /^(not checked|not measured|not assessed|not readable|unknown|n\/a|\u2014|-)\b/i;
  const counted = rows.filter(r => r && !NOT_RUN.test(String(r.val || '').trim()));
  const problems = counted.filter(r => r.ok === false);
  const risks = (ba._claimRisks || lead._claimRisks || []);

  // Phone as a person reads it. "+12143304682" is a database value; "(214)
  // 330-4682" is what someone dials, and this row exists to be dialled from.
  const prettyPhone = (p) => {
    const d = String(p || '').replace(/\D/g, '');
    const t = d.length === 11 && d[0] === '1' ? d.slice(1) : d;
    return t.length === 10 ? '(' + t.slice(0,3) + ') ' + t.slice(3,6) + '-' + t.slice(6) : (p || '');
  };
  const L = (label, value, sub, accent) => React.createElement('div', { style: { minWidth: 0 } },

    "I caught a problem"         "your quote form is dead"
    "the form isn't working"     "site's down on mobile"
  FAILS — nobody who works there talks like this:
    "I caught your review gap"      → no employee has ever said "gap". CONSULTANT.
    "I mapped your quote path"      → that is an agency deliverable. AGENCY.
    "your quote form goes quiet"    → nobody at a company says this. COPYWRITER.
    "585 reviews. Not showing up."  → an ad headline. MARKETING.
    "nobody sees your reviews"      → technically about a fault, still nothing a
                                       colleague would type. ROBOTIC.

═══ WHAT COLLEAGUES ACTUALLY SAY, AND WHY IT WORKS ═══
They name the thing and say it is broken, because that is the fastest way to get
someone to look. It is not a technique — it is just how people talk when something
is wrong:
    broken · down · dead · not working · stuck · problem · nothing · nobody
They also say "I caught..." and "I found..." because they did, and because it
explains why they are messaging at all.

They never say: gap · goes quiet · aren't showing · opportunity · room ·
potential · underperforming · optimize · leverage · unlock · maximize.
Those are words from people selling something, and an owner has an ear for them.

═══ THE TWO SHAPES ═══
(1) THE ALARM — his thing, and what is wrong with it.
      "your traffic is broken" (22c)   "your quote form is dead" (23c)
      "your title tag is broken" (24c) "nothing answers after 5" (23c)

(2) I FOUND SOMETHING — we looked, and there is a problem.
      "I caught a problem" (18c)       "I caught a dead quote form" (26c)
      "found a problem on your site" (28c)
    Mike named this shape himself, and it works precisely because it is what a
    person says when they have spotted something.

    ⚠ ONE PRACTICAL LIMIT ON SHAPE 2, AND IT IS ABOUT DELIVERABILITY, NOT VOICE.
    A bare "I caught a problem" is a good line — but it is identical for every
    lead, and a live run sent that exact subject to a sign shop in Texas and a med
    spa in San Antonio. Mailbox providers weigh repeated subject lines from a young
    sending domain, and this domain has no sending history to spend. The prospect
    would never know; the spam filter would.
    SO: use the bare version SPARINGLY — as a B variant, not as the default — and
    prefer the version that names his thing ("I caught a dead quote form"), which
    is both more specific and unrepeatable.

═══ LENGTH ═══
Under 30 characters. Gmail's mobile app cuts at roughly 30-37, Apple Mail on
iPhone at 40-48, and every one of the internal-sounding examples above lands at
18-28 without trying. That is not a coincidence: nobody types a 40-character
subject about a fire.

═══ ALSO BANNED, ALWAYS ═══
  · Our name, our service, growth, marketing, audit-as-a-product, any offer
  · Numbers in the subject ("585 reviews...") — that is data, and colleagues do
    not lead with data, they lead with the problem
  · Two clauses split by a full stop or dash for rhythm — that is copywriting
  · Question marks — a colleague reporting a fault does not ask
  · Title Case Like This — internal messages are lowercase and unfussy

═══════════════════════════════════════════════════════════════════════════════
THE STOPPING SURFACE — SUBJECT + FIRST LINE ARE ONE UNIT. DESIGN THEM TOGETHER.
═══════════════════════════════════════════════════════════════════════════════
This is the most commonly missed thing in the entire email, so read it twice.

He decides whether to open BEFORE he has read a word of the body. What he can see
at that moment is the subject (~35 characters) plus roughly 40 characters of the
FIRST BODY LINE, shown as preview text right beside it. About 75 characters total.
That is the whole surface you have to stop a man who is scanning his inbox to
check whether anything has gone wrong.

THE FIRST LINE OF THE BODY IS NOT AN OPENING. IT IS THE SECOND HALF OF THE HOOK.
It will be read in the inbox, next to the subject, by someone who has not opened
anything. Write it knowing that.

WHAT THIS SYSTEM HAS BEEN DOING WRONG — these are real, from live sends:
  SUBJECT: Perfect reviews. Still losing the j…
  PREVIEW: Sean — you've earned a perfect 5-star ra…
  → The preview is a COMPLIMENT. Nothing here makes anyone stop. He has been told
    he is doing well, which is pleasant and entirely ignorable.

  SUBJECT: 19 years of trust, zero way to foll…
  PREVIEW: Dr. Simone — someone finds your 4.7 star…
  → The preview is a SETUP for a point that arrives two sentences later, long after
    the decision to open or ignore has already been made.

WHAT IT SHOULD DO — the subject is the ALARM, the first line is what makes it real.
Both are short. He sees roughly 30 characters of subject and 40 of preview, and
that is the entire surface. Anything past it is written for nobody.

  SUBJECT: your booking form is dead
  PREVIEW: every quote after 6pm sits till morning
           (39 chars — fits)

  SUBJECT: nobody answers after 5
  PREVIEW: those calls are going to other builders
           (39 chars — fits)

  SUBJECT: you're invisible for implants
  PREVIEW: patients in Indianapolis aren't finding you
           (43 chars — borderline, front-loaded so it survives the cut)

MY EARLIER EXAMPLE WAS TOO LONG AND IS THE MISTAKE TO AVOID:
  PREVIEW: "the patient searching at 8pm books whoever answers first —"  (58 chars)
  He sees "the patient searching at 8pm books whoev" and the point — that they
  book SOMEONE ELSE — falls off the end. The whole sentence existed to deliver a
  word he never reads. Put the loss in the first six words or do not put it there.

  ═══════════════════════════════════════════════════════════════════════════════
THE LAPTOP TEST — A CONDITION IS IGNORABLE. EXPOSURE HAPPENING NOW IS NOT.
═══════════════════════════════════════════════════════════════════════════════
You walk out of a shop and realise you left your laptop outside. What goes through
your head is not "my laptop storage strategy is suboptimal." It is:
    it might get broken · it might get stolen · I need it
Three thoughts, all about RIGHT NOW, all about loss, and you stop what you were
doing immediately. Nobody schedules that for Tuesday.

That is the difference between a CONDITION and EXPOSURE:
  CONDITION (ignorable): "your implants page isn't ranking"
      → true, unwelcome, and entirely possible to deal with next month
  EXPOSURE (stops him):  "tonight, the people searching for implants in
                          Indianapolis are booking someone else"
      → the same fact, except it is happening while he reads it, and every hour
        he does nothing it happens again

Write in the PRESENT CONTINUOUS. Not what is wrong with his setup — what is
happening to his business right now because of it. Not "there is no way to book
after hours" but "the ones who find you after 5 are booking someone else."

AND DO NOT WRITE IT AS A HYPOTHETICAL. "Someone searches at 8pm on a Tuesday" is a
worked example — he reads it as a story you invented to make a point, and it costs
nothing to disagree with. "The ones finding you after 5 are booking elsewhere" is a
statement about his actual business, and the only way to disprove it is to go and
look. Make him want to go and look.

⚠ THIS RULE KEEPS BEING BROKEN IN THE FIRST SENTENCE, WHICH IS THE WORST PLACE FOR
IT. Live output opened with "Someone fills out your quote form at 9pm Sunday" and
"Someone in San Antonio searches 'med spa near me' right now" — both invented
people, in invented moments, in the preview slot he reads before deciding.
BANNED OPENINGS, every one of them a story:
  "Someone fills out..."  "Someone searches..."  "A homeowner finds..."
  "Imagine a customer..."  "Picture someone..."  "Say a patient..."
Rewrite each as a statement about his business as it stands right now:
  ✗ "Someone fills out your quote form at 9pm Sunday and nobody sees it till Monday"
  ✗ "Quote requests that arrive after 5 sit until the next morning"   ← ALSO WRONG.
     This was the ✓ answer here for months. It fixes the HYPOTHETICAL and keeps
     the FABRICATION: we never submit their form, so we do not know what happens
     to a request arriving at 5:01. Removing the invented person does not make an
     unobservable claim observable, and this is where the recurring
     "gets nothing back until Monday" line came from.
  ✓ "The only way to reach you outside office hours is a form"   ← measured: we
     read the booking path and found no scheduler and no chat.
  ✗ "Someone in San Antonio searches 'med spa near me' right now"
  ✓ "Google is showing 'Just a moment...' where your business name should be"
The second version of each is shorter, harder, and cannot be argued with — it is
either true of his site or it is not, and the only way to find out is to look.

═══════════════════════════════════════════════════════════════════════════════
DELIVER THE WORK. DO NOT OFFER IT.
═══════════════════════════════════════════════════════════════════════════════
Nobody sends content. That is the entire reason this works, and it is thrown away
the moment the email reads as a proposal to do something later.
  OFFERING (weak):    "I could take a look at your site and put something together"
  DELIVERED (strong): "I went through it and here is what I found: [the finding]"
The audit is not a thing he might receive if he replies. It is a thing that already
exists, was already done, and is already partly in front of him. The findings in
this email ARE the proof — he can verify every one of them in ten seconds without
answering you. The reply is for the rest of it, not for the first piece.

THIS IS WHY THE FINDINGS MUST BE CHECKABLE. "Your marketing could be stronger" is
an opinion he has to take on trust. "Your implants page does not appear in the top
20 for that search in your own city" is something he can confirm on his phone
before he decides whether to answer. Give him something to check.

═══════════════════════════════════════════════════════════════════════════════
THE BODY HAS THE SAME VOICE TEST AS THE SUBJECT. IT KEEPS FAILING IT.
═══════════════════════════════════════════════════════════════════════════════
The subject is now written as a colleague would write it. The body is not, and the
gap between them is what makes an otherwise good email read as marketing.

FROM A LIVE SEND:
  "People comparing electricians in Phoenix make that call in about sixty seconds,
   and the first thing that stops them is proof someone else already trusted you."
That is a well-built sentence. Two balanced clauses, a rhythm, a small reveal at
the end. It is COPYWRITING, and it is the thing an owner's ear is trained to catch.
No colleague has ever written a sentence like that in an email.

  A COLLEAGUE WOULD WRITE:
   "People pick in about a minute, and they look for reviews first. Yours are on
    Google. They are not on your site."
  Three short sentences. Same facts, same argument, none of the construction.

THE RULES THAT FOLLOW FROM THIS:
  · SHORT SENTENCES. If a sentence has two clauses joined for rhythm, split it.
  · NO REVEALS. Do not build to a point at the end of a sentence — lead with it.
  · SAY THE THING TWICE IF IT IS SHORTER THAN SAYING IT WELL ONCE.
    "Yours are on Google. They are not on your site." beats any single elegant
    sentence that carries the same content.
  · NO PROCESS DESCRIPTIONS. "I mapped where the reviews disappear and what is
    sitting in their place" tells him about OUR work. He wants the outcome:
    "Your reviews are on Google. Your site does not show them."
  · CONTRACTIONS, always. "isn't", "doesn't", "they're". Nobody types "is not"
    to a colleague, and the expanded form is the single clearest tell of written-
    rather-than-sent text.
  · READ IT ALOUD. If it sounds like something you would SAY standing in his shop,
    it is right. If it sounds like something you would PUBLISH, rewrite it.

RULES FOR THE FIRST LINE:
  · NEVER open with praise, a credential, or a rating. Compliments do not stop
    anyone; they are the most ignorable sentence in email.
  · NEVER open with setup or scene-setting that pays off later. The payoff arrives
    after the decision has been made.
  · It must complete or sharpen the subject, not restate it.
  · Front-load: the first 40 characters are everything, the rest is a bonus.
  · The name still goes first — "Sean —" — but the very next words must earn the
    open on their own.

BODY — exactly 5 parts, in this order, no headers, flowing prose:

THE EMAIL MUST CONTAIN ALL THREE OF THESE. NOT TWO. NOT A COMBINATION.
An owner scrolling his inbox has an expectation of how his day is going. He stops
and RECALCULATES only when a piece of information he did not consider lands and he
knows it changes the plan. That recalculation needs all three of the following at
once, and an email carrying only two of them gets noted and forgotten.

Measured against real output: the strongest email this system has produced carried
all three. The weakest carried two — it named the unexpected fact and gestured at
the loss, but never told the owner HOW HIS CUSTOMERS ACTUALLY BEHAVE, so there was
nothing to make him revise what he already believed.

[1] THE UNEXPECTED FACT — something true about HIS business he did not know.
    First name, then the hardest verified observation. One sentence. No preamble.
    Format: "{FirstName} — {specific verified observation}."

    ⚠ IF THERE IS NO CONFIRMED FIRST NAME, WRITE NO DASH. A live send opened with
    "— 220 five-star reviews and a homeowner..." because the name was empty and the
    dash stayed. That dangling dash is the first character of the email AND the
    first character of the preview text, and it reads as a broken mail-merge, which
    is the exact opposite of a message from someone on his team.
    NO NAME → open directly on the fact: "220 five-star reviews, and a homeowner
    landing on your page sees four phone buttons before a single one."
    Never "Hi there", never "Hey", never "To whom it may concern", and never a
    company name in place of a person.

    ⚠ THIS SENTENCE IS THE PREVIEW TEXT. Its first ~40 characters appear in his
    inbox beside the subject line, and he reads them BEFORE deciding to open. It is
    not an opening line, it is the second half of the hook — see THE STOPPING
    SURFACE above. Do not open with praise, a rating, a credential, or a setup.

    It must be genuinely NEW to him. If he already knows it, he files the email and
    moves on — nothing has changed for him. "Your site could convert better" is
    something he has heard from four agencies. "Your dental implants page does not
    appear in the top 20 when someone in Indianapolis searches it" is something he
    has never once checked.
    THE TEST: could he have told you this himself? If yes, it is not unexpected.

    OPENING PRIORITY (use the highest available):
      1st — A pain REPEATING across their OWN Google reviews, WITH the count. Their
            customers' words about their own business, and the number proves it is
            a pattern. Say the NUMBER. Describe the PATTERN only — never reproduce
            review text, never name a reviewer.
      2nd — A service they publish a page for and cannot be found for.
      3rd — A credential, rating or claim of theirs that is doing no work.
      4th — A confirmed break in how a customer reaches them.

[2] HOW PEOPLE ACTUALLY BEHAVE — THE RECALCULATION. This is the part most often
    missing, and it is the part that does the work.
    One sentence about how HIS CUSTOMERS actually decide — a truth about human
    behaviour in his market that reframes the fact in [1] as worse than he assumed.
    He is not surprised by the fact alone. He is surprised by what it MEANS.

    He believes: "my reviews are excellent, so I win the ones who find me."
    The reframe: "the builder who gets back to someone first wins the bid — not the
                  one with the best reviews."
    Now his 585 reviews are not an asset that protects him. They are an asset that
    never gets to participate. THAT is when he stops scrolling.

    More of the shape:
      · "A homeowner comparing three contractors in sixty seconds has no reason to
         pick you over the next result — not because your work is worse."
      · "The patient searching at 8pm books whoever answers, not whoever is best."
      · "People do not call back a business twice. They call the next one."
    Say it as a plain observation about people, not as a statistic and never as a
    cited study. It has to sound like something he half-knew and never said out loud.

[3] THE LOSS — what it costs him if nothing changes. Mandatory, never skipped,
    AND IT MUST CARRY A NUMBER. This is the element that goes missing most often and
    it is the one that converts a problem into a reason to act today.

    ⚠ MEASURED ON LIVE OUTPUT: four out of four email-1 variants named the problem,
    named the behaviour, and then stopped — no value, no number, nothing to weigh.
    "That adds up fast" and "real money gone quietly" are not losses; they are
    gestures at a loss, and an owner cannot act on a gesture. In every one of those
    emails the value was available and simply not used.

    A NUMBER IS ALWAYS AVAILABLE. If he publishes prices, use his. If he does not,
    use what a job in his trade is worth — that is public knowledge about an
    industry, not a claim about his books:
      sign shop → "a commercial sign job runs several thousand dollars"
      med spa   → "a filler or laser appointment is several hundred"
      dentist   → "an implant case is a five-figure decision"
      roofer    → "a replacement is $10-30k"
    Then make the arithmetic something he can do in his head: ONE of those, once a
    month, is the number he actually feels. Not a percentage, not a total, not a
    projection he would have to trust you for.
      WEAK:   "that adds up fast"
      STRONG: "one commercial sign job a month, at several thousand dollars each"
    An owner acts on loss far more readily than on upside, because an upside can be
    dealt with next quarter and a leak cannot. Frame it as money already leaving,
    not money he could theoretically gain.
      NOT: "you could be capturing more leads"
      YES: "one lost inquiry a month, at $15k-$30k a job, is real money gone quietly"
    Name it in the unit he counts — jobs, patients, cases, installs, contracts.

    ═══ WHERE A NUMBER MAY COME FROM ═══
    TWO kinds are allowed and the distinction matters:
      (a) NUMBERS HE PUBLISHED — posted prices, posted salaries, visible ad count,
          review count, staff count — plus honest arithmetic on those. Strongest,
          because he wrote them.
      (b) THE TYPICAL VALUE OF A JOB IN HIS TRADE — "a foundation repair runs five
          figures", "a deck job here is $15k-$30k", "an implant case is several
          thousand dollars". That is public knowledge about an INDUSTRY, not a claim
          about his books, and it is what turns an observation into something an
          owner can act on. Without it the email describes a feature and gets
          delegated to staff.
    STILL ABSOLUTELY BANNED: his revenue, his volume, his conversion rate, his ad
    spend, or any total loss figure. Never "you are losing $40k a month" — we cannot
    know it, he can check it, and one invented number destroys every true thing in
    the email.

    ═══ TIMELINE BEATS PROBLEM WHEREVER IT IS HONEST ═══
    Timeline-framed hooks reply at roughly 9-10% against 4-5% for problem-framed —
    a 2.45x difference from framing alone. A problem is a state of affairs and can
    be handled later; a timeline has a cost accruing while he does nothing.
      PROBLEM:  "you are invisible for crawl space repair"
      TIMELINE: "every week of storm season, those searches go to someone else"
    Only use a real one — a season, a competitor already moving, a window closing.
    Never manufacture urgency and never invent a deadline.

═══ THE DELEGATION TEST — APPLY TO THE WHOLE EMAIL BEFORE FINISHING ═══
Could this owner forward this email to a staff member and consider it handled?
If yes, IT HAS FAILED. He forwards it, an office manager replies "we'll look into
it", and the conversation is over — you are now selling a tool to an employee
instead of growth to an owner.
An owner delegates TASKS. He does not delegate REVENUE.
  DELEGATABLE (fails): "There is no online booking tool on your site."
  NOT DELEGATABLE (works): "The patient searching at 8pm can't book, so she books
    with whoever lets her. In this market that is a five-figure case decided by who
    answers first, not by who is better."
Same finding. Different altitude. Only he can act on the second.

[4] THE PROOF-OF-WORK — What you already built for them, before any call.
    One sentence. Concrete and specific. "I mapped the funnel and built X."
    This is what earns the reply — it proves you did the work, not just wrote an email.

[5] NOTHING. THIS PART NO LONGER EXISTS IN EMAIL 1.
    This slot used to hold a client proof point. It is deliberately empty now, and that
    is the single highest-leverage rule in this template.

    WHY: Gong analysed more than 28 million cold emails and found reply rates fall by
    UP TO 57% the moment the sender shifts into pitch mode — defined precisely as
    describing the product, claiming results, or asking for the meeting. A line like
    "we run growth retainers — one client returned $140k on $4k/month" is TWO of those
    three at once. Separately, a documented campaign with ZERO pitch in the first email
    returned a 34% reply rate against a 3.43% industry average. And 58% of all replies
    come from email 1, so this is the message where the cost of pitching is highest.

    The first email has exactly one job: make replying easy and risk-free. We are
    selling the reply, not the service. He does not need to know what we sell in order
    to say "yes, send it" — he only needs to believe we found something real.

    THEREFORE, IN EMAIL 1, NEVER:
      · Name or describe a service ("we run growth retainers", "our AI system", "we do
        end-to-end marketing", "website rebuilds")
      · State or imply a price, retainer, or engagement size
      · Cite a client result, ROI figure, multiple, or case study — including the
        plumbing company, the seasonal business, Kraft Heinz, and UCW
      · Say "we", "our team", "our clients", or "companies like yours" in a selling sense
      · Explain how we would fix it, or what the fix would involve
      · Reference our capacity, our ad-spend range, or our structure

    THIS IS NOT A LOSS OF PERSUASION — IT IS THE SOURCE OF IT. The audit already proves
    competence. Adding a sales claim on top converts a diagnosis into a pitch and gives
    him something to object to before he has agreed there is a problem at all.

    THE PROOF POINTS STILL MATTER — THEY BELONG TO MIKE, ON THE CALL. They are the
    strongest asset we have once a conversation exists. They are simply worthless in
    an email from a stranger, because he has no reason yet to believe them.

    COHERENCE STILL APPLIES. The problem you diagnose must still be the problem we
    would actually be hired to fix — a diagnosis that points nowhere near our work
    produces a reply we cannot convert. Diagnose the right thing; just do not sell it.

[6] THE ASK — RELEASE something that already exists. Never request time. One short sentence.
    Asking a stranger for time up front measurably suppresses replies, because his calendar is
    a cost to him. Something already built is free to accept.

    PHRASE IT AS EXISTING, NOT AS PENDING. Small wording difference, real effect, and it
    follows directly from DELIVER THE WORK above. "Want me to send it over?" can be heard as
    "shall I go and make you something?" — which turns finished work back into a proposal and
    quietly undoes the one thing that makes this email different from every other one he got
    today.
      STRONGEST (it exists, it is his):
        "The write-up is yours whenever you want it."
        "I will send the breakdown over — just say the word."
        "Say the word and it is in your inbox."
      ACCEPTABLE:
        "Want the breakdown?" / "Should I send you what I found?"
      BAD — requests his time:
        "Worth 20 minutes to walk through what I found?"
        "book a demo" / "let us schedule a call" / "grab 15 minutes"

    THE CALL HAPPENS ON THE REPLY, NEVER IN THE EMAIL. He is agreeing to receive something,
    not to meet anyone, and that is exactly why he says yes.

    ⚠ STATE THAT IT EXISTS, THEN MAKE REPLYING UNMISTAKABLE. There is a real tension here
    and it has to be resolved in one sentence, not by picking a side. "The write-up is
    yours whenever you want it." is the right FRAME — the work is done, nothing is being
    proposed — but on its own it asks him for nothing, and a man who is asked for nothing
    does nothing. We are buying a REPLY. The reply is the entire product of this email.
    So the last sentence must do both: establish that it exists, and leave a single
    obvious action.
      BEST — exists, then a short question:
        "I mapped exactly where it breaks. Want it?"
        "It's written up. Should I send it over?"
        "The whole path is documented — want me to send it?"
      ALSO FINE — exists, then a plain directive:
        "The write-up is yours — just say the word."
      WEAKEST — exists, and nothing else:
        "The write-up is yours whenever you want it."
        (True, generous, and completely passive. He agrees silently and moves on.)
    Four to six words for the ask. Never two sentences of it.

TOTAL LENGTH: 75-110 words. Executives triage on a phone in seconds, and the
highest-performing executive emails sit in the 75-100 word range. Every sentence
that is not the fact, the money, the proof-of-work or the ask should be cut.

═══ WRITE FOR A BUSINESS OWNER, NOT A MARKETER ═══
The reader owns a roofing company, a CPA practice, an insurance agency. He has never
heard of an H1 tag and does not care. If he reads one word of agency vocabulary he
files this with every other agency email and you have lost him in three seconds.

BANNED VOCABULARY — never appears in the email, no exceptions:
  pixel · retargeting · H1 / meta / schema / SEO · above the fold · funnel · CRM
  conversion rate · CTA · landing page · attribution · impressions · organic
  top-of-funnel · nurture sequence · lead magnet · optimization · UX
═══ CALIBRATE TO THIS PERSON — DO NOT WRITE TO A GENERIC "OWNER" ═══
There is no fixed vocabulary list for business language, because there is no single
kind of owner. A CPA, a plastic surgeon running eight staff, and a two-van garage
door operator are three different readers, and writing the same email to all three
means writing it well for none of them. Meeting a person where they actually are IS
the personalisation — it is the same skill as reading their About page, applied to
how they think rather than what they do.

YOU ALREADY HAVE THE EVIDENCE. Read it before choosing a single word:

  1. THEIR OWN WEBSITE'S LANGUAGE — the strongest signal and it is free. It is
     printed above. If their site talks about maximising return, growth, or
     investment, they are fluent and you can speak that way. If it talks about
     treating customers like family and doing the job right, that is who they are
     and business-school words will land like a foreign accent. Mirror their register.
  2. THEIR TITLE AND CREDENTIALS — MD, DDS, CPA, Esq., Managing Partner signal
     someone who ran a P&L through professional training. "Owner" on a trade
     business signals someone who learned money by living it, not by studying it.
     Both understand money completely; they use different words for it.
  3. SIZE — a 40-person operation has a bookkeeper and probably an accountant, and
     the owner talks in those terms. A three-person shop is the owner's own wallet.
  4. WHAT THEY PUBLISH — posted prices, posted salaries, published packages mean
     they are comfortable being explicit about money. Use their own numbers back.
  5. THE MOMENT THEY ARE IN — actively selling, just funded, or preparing to exit
     makes valuation language not just acceptable but the sharpest thing you can
     say. Every dollar of profit becomes a multiple of sale price, and they know it.
  6. THEIR OWN STORY — if the About page is written in his voice, that voice tells
     you how to write back to him.

THE ONE TEST THAT REPLACES EVERY WORD LIST: would THIS person, based on what we just
read about him, use this word himself? If yes, use it. If you cannot picture him
saying it, say the same thing the way he would.

  "ROI" — nearly every business owner knows this. Fine almost everywhere.
  "EBITDA / multiple / unit economics" — right for a seller, a funded founder, a
    CPA or a financially sophisticated practice. Wrong for a two-van contractor,
    where it reads as someone performing seniority.
  "CAC / LTV / attribution / payback period" — marketing-operator vocabulary. Almost
    never right here: our reader is the buyer, not the practitioner.

WHEN THE EVIDENCE IS THIN, DEFAULT TO PLAIN. A job, a customer, a dollar are
universal — every owner alive understands them, and no one has ever been put off an
email for being too clear. Sophistication is something you EARN THE RIGHT TO USE by
having read them correctly, never the default setting.
ALSO AVOID this consultant-flavored phrasing — it signals "agency" even without jargon:
  "I mapped every drop-off point"  → "I went through your site the way a customer would"
  "conversion audit" / "funnel map" → "I wrote up what I found"
