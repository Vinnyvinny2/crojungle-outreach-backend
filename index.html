<style>
*{box-sizing:border-box;margin:0;padding:0;font-stretch:normal;font-kerning:normal;text-size-adjust:100%;-webkit-text-size-adjust:100%}
:root{--bg:#090a0e;--s:#101219;--s2:#171a23;--b:rgba(148,163,184,0.10);--b2:rgba(148,163,184,0.18);--p:#7c3aed;--a:#a3e635;--t:#eef1f6;--m:#727a88;--m2:#a2aab8;--r:#ef4444;--am:#f59e0b;--g:#22c55e;--elev:0 1px 2px rgba(0,0,0,.5),0 14px 34px -10px rgba(0,0,0,.55)}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:'Inter',sans-serif;transform:none;font-stretch:100%;-webkit-font-smoothing:antialiased}
#root{height:100%}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--s);border-right:1px solid var(--b);display:flex;flex-direction:column;padding:24px 0}
.logo{padding:0 20px 28px;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:clip}
.logo span{color:var(--a)}
.nl{padding:0 20px 8px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}
.ni{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13px;font-weight:500;color:var(--m2);border-left:2px solid transparent;transition:all .15s}
.ni:hover{color:var(--t);background:rgba(255,255,255,.03)}
.ni.active{color:var(--t);background:rgba(124,58,237,.12);border-left-color:var(--p)}
.nb{margin-left:auto;background:var(--r);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.nb.g{background:var(--g)}
.sb{padding:16px 20px;border-top:1px solid var(--b);font-size:11px;color:var(--m)}
.sb strong{color:var(--a)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.tb{position:sticky;top:0;z-index:10;background:rgba(9,10,14,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--b);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.tt{font-family:'Syne',sans-serif;font-weight:700;font-size:20px}
.ts{font-size:12px;color:var(--m);margin-top:2px}
.content{padding:32px;flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none;font-family:'Inter',sans-serif}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{filter:brightness(1.1)}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-a{background:var(--a);color:#0a0a0f}.btn-a:hover{filter:brightness(1.1)}

.btn-g{background:transparent;color:var(--m2);border:1px solid var(--b2)}.btn-g:hover{color:var(--t)}
.btn-sm{padding:7px 14px;font-size:12px}
.card{background:var(--s2);border:1px solid var(--b);border-radius:14px;padding:24px;box-shadow:var(--elev)}
.input{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:10px;padding:12px 16px;color:var(--t);font-size:13px;font-family:'Inter',sans-serif;outline:none}
.input:focus{border-color:var(--p)}
.input::placeholder{color:var(--m)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--m);margin-bottom:8px;display:block}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.tp{background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.ta{background:rgba(163,230,53,.1);color:var(--a);border:1px solid rgba(163,230,53,.2)}
.tr{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.tam{background:rgba(245,158,11,.1);color:#fcd34d;border:1px solid rgba(245,158,11,.2)}
.empty{text-align:center;padding:64px 32px;color:var(--m)}
.empty h3{font-family:'Syne',sans-serif;font-size:18px;color:var(--m2);margin-bottom:8px}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--b);margin:20px 0}
.pb{background:var(--s2);border:1px solid var(--b2);border-radius:12px;padding:18px;font-size:13px;line-height:1.7;color:var(--m2);white-space:pre-line}
.ci{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--s2);border:1px solid var(--b);border-radius:8px;cursor:pointer}
.ci.ck{border-color:var(--r)}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--b2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px}
.ci.ck .cb{background:var(--r);border-color:var(--r);color:#fff}
.rl{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--s2);border:1px solid var(--b);border-radius:8px;cursor:pointer;text-decoration:none;color:var(--t);transition:all .15s}
.rl:hover{border-color:var(--p)}
textarea.input{min-height:140px;resize:vertical}
.toast{position:fixed;bottom:24px;right:24px;z-index:1000;background:var(--s2);border:1px solid var(--b2);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:10px;font-size:13px;animation:su .3s ease}
@keyframes su{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script>

// ═══ SUPABASE — persistent cloud storage ═══════════════════════════════════
// All writes go to BOTH localStorage (instant, offline) AND Supabase (persistent).
// On load, Supabase wins if it has data — so switching devices/domains is safe.
const SB_URL = 'https://rxkjgevunvpchcydxsft.supabase.co';
const SB_KEY = 'sb_publishable_Od9pkGnOkO_kLxjbjBJVLg_RanMHlAI';

const sbFetch = async (path, options = {}) => {
  try {
    const r = await fetch(SB_URL + '/rest/v1' + path, {
      ...options,
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': options.prefer || 'return=minimal',
        ...(options.headers || {})
      }
    });
    if (!r.ok) { const t = await r.text(); console.warn('Supabase error:', r.status, t); return null; }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  } catch(e) { console.warn('Supabase fetch failed:', e.message); return null; }
};

// Convert a lead object to a Supabase row
const leadToRow = (l) => ({
  id: l.id,
  name: l.name || '',
  website: l.website || '',
  email: l.email || '',
  founder_name: l.founderName || '',
  icp_score: l.icpScore || 0,
  reachability: l.reachability || 0,
  source: l.source || '',
  discovery_source: l.discoverySource || '',
  discovery_reason: l.discoveryReason || '',
  status: l.status || 'new',
  signals: l.signals || {},
  buckets: l.buckets || null,
  top_pain: l.topPain || null,
  // FIVE FIELDS THAT USED TO VANISH ON RESTORE.
  // lsa, adCount, outreachChannel, ownerEmailMatch and ownerEmailMatchReason are all
  // returned by /api/research and all displayed in the UI, but none had a column, so
  // reloading a lead from Supabase silently blanked them — the audit rows reverted to
  // "Not checked" and the owner/email match reasoning disappeared, on data we had
  // already paid Firecrawl and the verifier to establish.
  //
  // Nested inside brain_audit rather than given their own columns ON PURPOSE. A new
  // column needs a Supabase migration, and if the code shipped before the migration
  // ran, PostgREST would reject the whole row and EVERY save would fail silently —
  // trading five missing fields for total data loss. brain_audit is already saved,
  // already restored, and is never key-iterated anywhere in either file, so nesting
  // here is invisible to every other consumer and needs no migration at all.
  // ══ THE ROW GREW ONE FULL AUDIT COPY PER RELOAD-THEN-SAVE ══════════════
  // l.brainAudit after a reload already CONTAINS the previous _persisted
  // (which itself nests brainAudit), so spreading it whole and then nesting
  // l.brainAudit again stacked one complete audit copy per cycle, forever —
  // write-only bloat feeding the documented 13.87MB / PostgREST-500 failure.
  // Strip the old _persisted from the spread, and nest an audit copy that
  // carries no _persisted of its own. Nothing reads either back.
  brain_audit: l.brainAudit
    ? { ...(({ _persisted, ...rest }) => rest)(l.brainAudit), _persisted: {
        lsa: l.lsa ?? null,
        // ══ THE PREDICTOR HAS NEVER BEEN GRADED, AND THIS IS WHY ═══════════
        // Twelve leads across twelve runs all logged: "no prediction was sent for
        // this lead, so there is nothing to grade. This is a LEGACY LEAD." Every
        // one of them. Including leads discovered minutes earlier, which the
        // message insists "do carry it".
        //
        // reachPredict is computed at Find time and held in memory. It was never
        // written to leadToRow, so it never reached Supabase, so the moment a lead
        // was saved and reloaded the value was gone. The pipeline holds 160+ leads
        // and every one of them is loaded from the cloud at boot — so by the time
        // anything is researched, the prediction has always already been lost.
        //
        // The consequence is not a missing log line. The predictor decides which
        // leads are worth spending Firecrawl and Hunter credits on, and its
        // accuracy has never once been measured. We have been running a bet-sizing
        // model for months with the scoreboard disconnected.
        reachPredict: l.reachPredict ?? null,
        reachPredictWhy: l.reachPredictWhy ?? null,
        // ══ THE SAME LEAK, FIVE MORE FIELDS ═══════════════════════════════
        // Auditing every field the research request sends against what leadToRow
        // actually writes turned up five more computed at Find time and never
        // saved. Each one is gone the moment a lead makes a round trip through
        // Supabase, which every one of the 160+ leads in this pipeline has done.
        //
        // verifiedCEO is the costly one: scoreReachability reads it, so a lead
        // that had a confirmed decision-maker at discovery arrives at research
        // with none, and scores lower than the evidence we already paid for
        // justifies. The other four quietly weaken the pitch framing rather than
        // the score \u2014 a funding or exit trigger that would have set the buying
        // window, the ICP condition that matched, the lane, and which roles were
        // manual (the whole software-build argument).
        //
        // None of these is expensive to keep. They were simply never added to the
        // one function that decides what survives.
        verifiedCEO: l.verifiedCEO ?? null,
        verifiedCEOTitle: l.verifiedCEOTitle ?? null,
        // The job-signal fields, so a re-run does not lose the window. These are
        // NOT duplicated below — rowToLead has produced nine separate
        // duplicate-key collisions and every one silently blanked data that had
        // just loaded correctly, so each of these appears exactly once here and
        // exactly once in rowToLead.
        signalAgeDays: l.signalAgeDays ?? null,
        signalDate: l.signalDate ?? null,
        raiseAmount: l.raiseAmount ?? null,
        jobPostingUrl: l.jobPostingUrl ?? null,
        jobPostedAt: l.jobPostedAt ?? null,
        marketingRoles: l.marketingRoles ?? null,
        opsRoles: l.opsRoles ?? null,
        marketingChannels: l.marketingChannels ?? null,
        discoverySignals: l.discoverySignals ?? null,
        icpProfile: l.icpProfile ?? null,
        buyingLane: l.buyingLane ?? null,
        manualCategories: l.manualCategories ?? null,
        adCount: l.adCount ?? null,
        outreachChannel: l.outreachChannel ?? null,
        ownerEmailMatch: l.ownerEmailMatch ?? null,
        ownerEmailMatchReason: l.ownerEmailMatchReason ?? null,
        localVisibility: l.localVisibility ?? null,
        // placeId and industry are INPUTS to research, not outputs, which is why they
        // were never saved — and why the two highest-value signals in the system
        // silently switched themselves off the moment a lead was reloaded.
        // placeId locates their Google reviews (the review-pattern mine); industry
        // builds the query a customer would type (the local-rank audit). Without them
        // research logs "SKIPPED — no Google placeId" and "skipped — no industry" and
        // carries on, so the loss is invisible unless you read the log line by line.
        // A live run lost both on all three leads, including one that had them an
        // hour earlier straight out of discovery.
        placeId: l.placeId ?? null,
        // Find's own read of the business. Persisted so a Research re-run after
        // a page reload still knows the markets and the website grade — the
        // "computed but not passed" shape this project has lost fields to before.
        marketsSeen: l.marketsSeen ?? null,
        marketsAbsent: l.marketsAbsent ?? null,
        marketCount: l.marketCount ?? null,
        noWebsite: l.noWebsite ?? null,
        builderSite: l.builderSite ?? null,
        leadChannel: l.leadChannel ?? null,
        industry: l.industry ?? null,
        // The measured binding layer, and whether they can fund the engagement.
        // Both are needed AFTER research — the write-up picks its case study from
        // the layer, and affordability decides who is worth a send — so both have
        // to survive a reload. Nested here for the same reason as everything else
        // above: no migration, no risk of PostgREST rejecting the whole row.
        growthConstraint: l.growthConstraint ?? null,
        situationRead: l.situationRead ?? null,
        affordability: l.affordability ?? null,
        // Frozen at send time. Without this surviving a reload the whole point
        // of capturing it is lost.
        sentSnapshot: l.sentSnapshot ?? null,
        abVariant: l.abVariant ?? null,
        phone: l.phone ?? null,
        phoneDisplay: l.phoneDisplay ?? null,
        edited: l.edited ?? null,
        candidateFindings: l.candidateFindings ?? null,
        ownerReplyCount: l.ownerReplyCount ?? null,
        reviewsRead: l.reviewsRead ?? null,
        // ── THE AUDIT'S OWN CONTEXT ──────────────────────────────────────
        // auditedWebsite and domainMatch were merged onto the lead and never
        // saved, so after a reload the Research tab reported "No website audited
        // \u2014 findings are from signals only" on a business whose site HAD been
        // audited, and every signal row fell back to "Not checked". The audit had
        // not been cut short; its result had been forgotten.
        auditedWebsite: l.auditedWebsite ?? null,
        // Merged onto the lead and never saved, so after a reload nothing could
        // prove the page had been fetched. Trimmed \u2014 we only need enough to
        // establish that we read it, not the whole page again.
        homepageContent: (l.homepageContent || '').slice(0, 4000) || null,
        // ── THE REST OF THE AUDIT ────────────────────────────────────────
        // These were merged onto the lead and never saved, so a reload lost the
        // audit's own conclusions, its pain evidence, what the screenshot showed
        // and the value-equation read. Everything downstream \u2014 the call sheet,
        // the write-up, the Research tab \u2014 then had to reconstruct from
        // whatever survived, which is the root of every "nothing on file" we
        // have chased tonight.
        brainAudit: l.brainAudit ? (({ _persisted, ...rest }) => rest)(l.brainAudit) : null,
        flaws: l.flaws ?? null,
        publicPainSignals: l.publicPainSignals ?? null,
        visualAnalysis: l.visualAnalysis ?? null,
        valueEquation: l.valueEquation ?? null,
        // The published one-change diagnosis. Code-assembled server-side from the
        // binding layer, the first broken link and the buying-path friction, all
        // three of which were measured on every lead and rendered nowhere.
        theOneThing: l.theOneThing ?? null,
        // Positive-only advertising evidence from Google's own Transparency
        // Centre. Never a negative: only verified advertisers appear there.
        adsTransparency: l.adsTransparency ?? null,
        ctaMode: l.ctaMode ?? null,
        // When the measurements were taken, and when to phone. Both matter only
        // for the call sheet, and the first one matters a lot: a rank or a review
        // count asserted three weeks late is how a call ends badly.
        researchedAt: l.researchedAt ?? null,
        callWindow: l.callWindow ?? null,
        pageUrl: l.pageUrl ?? null,
        topPain: l.topPain ?? null,
        buckets: l.buckets ?? null,
        signals: l.signals ?? null,
        auditedWebsiteResolved: l.auditedWebsiteResolved ?? null,
        domainMatch: l.domainMatch ?? null,
        domainMatchConfidence: l.domainMatchConfidence ?? null,
        domainMatchReason: l.domainMatchReason ?? null,
        richData: l.richData ?? null,
        // (flaws is already persisted above. The second copy was identical so it
        // changed nothing — but a duplicate-key report you have learned to shrug
        // at is exactly where a harmful one hides. The gate is only useful at 0.)
        // (visualAnalysis is already persisted above — storing it twice doubled
        // its cost in every row for nothing.)
        // The remainder of what a research run produces. Everything the audit
        // learns should survive a page reload \u2014 anything that does not comes back
        // as "Not checked" and reads as a thin audit rather than a lost one.
        copyFlags: l.copyFlags ?? null,
        positioningRead: l.positioningRead ?? null,
        positioningScore: l.positioningScore ?? null,
        signalConfidence: l.signalConfidence ?? null,
        companyTriggers: l.companyTriggers ?? null,
        verifiedEmployees: l.verifiedEmployees ?? null,
        verifiedRevenue: l.verifiedRevenue ?? null,
        employees: l.employees ?? null,
        // ══ DO NOT PERSIST AN INLINE SCREENSHOT ═══════════════════════════
        // Firecrawl sometimes returns the screenshot as a data: URI — a base64
        // PNG, frequently hundreds of kilobytes. Stored per lead that is the
        // single largest thing in the table by a wide margin, and it is the main
        // reason 161 leads came to 13.87MB and Supabase answered 500.
        //
        // A hosted URL is a few dozen bytes and worth keeping. An inline image is
        // not: it re-renders from the next research run, and keeping it costs the
        // durability of everything stored alongside it.
        screenshotUrl: (typeof l.screenshotUrl === 'string' && l.screenshotUrl.startsWith('data:')) ? null : (l.screenshotUrl ?? null),
        // The scrollable render. Without it the audit view shows only the top of
        // the page — which is how "none of it is on that page" gets written about
        // content that is simply further down.
        fullPageUrl: (typeof l.fullPageUrl === 'string' && l.fullPageUrl.startsWith('data:')) ? null : (l.fullPageUrl ?? null),
        // Renders of the inner pages. Without this line they disappear on reload
        // and the audit view silently goes back to showing only the homepage.
        pageShots: Array.isArray(l.pageShots) ? l.pageShots.filter(x => x && typeof x.shot === 'string' && !x.shot.startsWith('data:')) : [],
        // The measured problems section. Without this it disappears on reload and
        // the audit silently falls back to the old signal commentary \u2014 exactly the
        // failure the page-render persistence had.
        problemList: Array.isArray(l.problemList) ? l.problemList : [],
        // ══ THE SAME PERSISTENCE BUG, THIRD TIME ══════════════════════════
        // pageShots needed this. problemList needed this. subjectOptions was
        // built, attached, read and put in the prompt \u2014 and dropped on reload,
        // so by the time Generate ran the model had no subjects and invented
        // its own. Four live emails, none using a built subject, and the
        // pipeline looked correct at every step except the last one.
        subjectOptions: Array.isArray(l.subjectOptions) ? l.subjectOptions : [],
        // The email the server composed from measurements. Same round-trip rule
        // as everything else: stored and reloaded, or it exists until refresh.
        composedEmail: l.composedEmail || null,
        // Found by the round-trip check, not by me. The allowlist reads these
        // to decide whether a figure in the copy is real \u2014 without them it holds
        // an empty set and flags true numbers as invented.
        // The ladder's own 61-field input. measuredNumbers is an 18-field
        // Google-side snapshot and the website half of the ladder was never
        // stored at all, so a reloaded lead could not rebuild a website
        // finding and fell through to the raw model path. Each of these keys
        // appears exactly ONCE here and exactly once in rowToLead - this
        // function has produced nine duplicate-key collisions, every one of
        // them silently blanking data that had just loaded correctly.
        ladderInputs: l.ladderInputs || null,
        measuredNumbers: l.measuredNumbers || null,
        // Found by the round-trip check, not by me. harmsRanked is the ranked
        // list the email prompt uses for the follow-up sequence; problemCount is
        // the number the email states out loud. Both were reaching the client and
        // both vanished on reload, which means a regenerate after a refresh had
        // no ranked list and no count.
        harmsRanked: Array.isArray(l.harmsRanked) ? l.harmsRanked : [],
        problemCount: Number.isFinite(Number(l.problemCount)) ? Number(l.problemCount) : null,
        factualSpine: l.factualSpine || null,
        allowedReframes: Array.isArray(l.allowedReframes) ? l.allowedReframes : [],
        // The brain's judgement line — what a finding like this usually means in
        // a business of this kind. Validated server-side as category-level.
        patternLine: typeof l.patternLine === 'string' ? l.patternLine : '',
        originalFindings: Array.isArray(l.originalFindings) ? l.originalFindings : [],
        businessModel: l.businessModel || null,
        // growthConstraint and situationRead are NOT repeated here — they are
        // already persisted about a hundred lines above, with the reasoning for
        // why. Adding them again created a duplicate key that quietly overwrote
        // the first, which is the exact collision this object has produced before.
        visionAudit: l.visionAudit ?? null,
        reachabilityVerified: l.reachabilityVerified ?? null,
        researchBonus: l.researchBonus ?? null,
        preResearchScore: l.preResearchScore ?? null,
        offerStrength: l.offerStrength ?? null,
        sitePages: l.sitePages ?? null,
        htmlSignals: l.htmlSignals ?? null,
        gbpHealth: l.gbpHealth ?? null,
        socialPresence: l.socialPresence ?? null,
        marketClarity: l.marketClarity ?? null,
        leadMagnet: l.leadMagnet ?? null,
        reviewCount: l.reviewCount ?? null,
        rating: l.rating ?? null,
        leadSignal: l.leadSignal ?? null,
        // ══ THE WARNING VANISHED ON THE FIRST RELOAD ══════════════════
        // Dr. Levi Young, live: Firecrawl was throttled mid-run, the owner
        // lookup never got to read the pages it needed, and the card came
        // back "No decision-maker identified — 18/100". The amber banner that
        // exists to say "we were not allowed to look" was rendering correctly
        // and was never SAVED, so the moment the app reloaded the lead looked
        // genuinely unreachable and there was nothing on screen to say
        // otherwise. Same disease as reachPredict and the other five fields
        // above: computed, rendered once, and gone on the round trip.
        rateLimited: l.rateLimited ?? null,
        duplicateListing: l.duplicateListing ?? null,
        whatChanged: l.whatChanged ?? null,
        nicheBrief: l.nicheBrief ?? null,
        // A refusal is terminal — the server refused to research a non-owner
        // and the lead must not render as an ordinary un-researched lead after
        // a refresh, inviting the exact re-run that can only refuse again.
        notAFit: l.notAFit ?? null,
        rejectedReason: l.rejectedReason ?? null,
        rejectedAt: l.rejectedAt ?? null,
        brainFailReason: l.brainFailReason ?? null,
        promptPath: l.promptPath ?? null,
        // Saved for the same reason. A run that came back with a screenshot
        // and no audit must be able to say so after a reload, instead of
        // rendering as a lead nobody has researched yet.
        brainFailed: l.brainFailed ?? null,
      } }
    : (l.lsa != null || l.adCount != null || l.outreachChannel != null || l.ownerEmailMatch != null)
      // No audit yet but the fields exist — keep them rather than drop them.
      ? { _persisted: {
          lsa: l.lsa ?? null, adCount: l.adCount ?? null,
          outreachChannel: l.outreachChannel ?? null,
          ownerEmailMatch: l.ownerEmailMatch ?? null,
          ownerEmailMatchReason: l.ownerEmailMatchReason ?? null,
        } }
      : null,
  recommended_product: l.recommendedProduct || null,
  top_three_products: l.topThreeProducts || [],
  stack_combo: l.stackCombo || null,
  pitch: l.pitch || '',
  subject: l.subject || '',

// Convert a Supabase row back to a lead object
// ══ ONE DEFINITION OF WHERE THE MEASURED FIELDS LIVE ═════════════════════════
// The ladder, the spine, the problem list and the composed email exist in two
// places on purpose: inside brainAudit as the server sent them, and flat on the
// lead where the UI and the save path read them. That is fine. What was not fine
// is that only ONE of the two writers knew it.
//
//   rowToLead        (on reload)  wrote the flat copy   ✓
//   the research merge            wrote brainAudit only ✗
//
// So a completed run updated brainAudit and left the flat copy holding whatever
// the last reload had put there. On All-Weather the audit screen showed Run B's
// narrative — "40,000 customers served, and almost none of them left a trace" —
// above Run A's three findings, including "the only way to reach them is a phone
// call during office hours", which Run B had already disproved by measuring an
// online booking link. A false finding, on screen, after the run that killed it.
//
// It is also why /api/compose-email kept answering harmsRanked=0, problemList=0
// on freshly researched leads: it reads the flat copy, and nothing had written
// it since the last refresh.
//
// Adding the writes to the merge would have fixed today and drifted again the
// next time a field was added, because the mapping would still exist twice. So
// the mapping exists once, here, and both writers call it.
// ══ A CRITICAL FABRICATION BLOCKS APPROVE, IT DOES NOT DECORATE IT ══════════
// Donna Krummen, live 2026-08-20: her checklist said confidence 3/10 and listed
// fact-check CRITICAL findings — wrong city, wrong review count, wrong rank, a
// homepage promise her page never made — and the green "Approve for send"
// button sat under it, enabled. A warning next to an enabled button is a
// decoration; the operator taps through it on lead forty of fifty. CRITICAL
// claims are the fact-checker saying the copy asserts something we measured to
// be FALSE, and "I'd rather send nothing than tell them something's wrong when
// it isn't" is the one rule of this system. Approval now requires re-running
// Research (which rebuilds the copy from fresh measurements) — the same remedy
// the wrong-company banner already uses.
// ══ THE FIRST EVIDENCE THIS PROJECT WILL EVER HAVE ═════════════════════════
// Twelve emails, zero human replies, and every quality judgement in this system
// is the system grading its own homework. A cold call answers in thirty seconds
// and the answer comes with a reason attached.
//
// The pairing is the whole point: WHICH FINDING opened the call, and what
// happened. One without the other is a diary.
const CALL_OUTCOME_LABELS = [
  ['booked', 'Booked'], ['interested', 'Interested'], ['callback', 'Call back'],
  ['not_now', 'Not now'], ['not_a_fit', 'Not a fit'],
  ['no_answer', 'No answer'], ['gatekeeper', 'Gatekeeper'],
];
const recordOutcome = async (lead, outcome, extra) => {
  const x = extra || {};
  const ba = (lead && lead.brainAudit) || {};
  // The finding the call opened on, read from the same place the email reads it,
  // so the two can never disagree about what was said.
  const spine = ba.factualSpine || (ba._persisted && ba._persisted.factualSpine) || null;
  const sim = (lead.generatedResult && lead.generatedResult.prospectSim) || lead.prospectSim || null;
  const body = {
    leadId: lead.id, company: lead.name,
    outcome,
    findingId: (spine && (spine.claimId || spine.id)) || '',
    findingText: (spine && spine.claim) || '',
    said: x.said || '',
    followUpAt: x.followUpAt || '',
    nextStep: x.nextStep || '',
    predicted: String((sim && (sim.reason || sim.why || sim.reaction)) || '').slice(0, 400),
  };
  const r = await fetch(BACKEND + '/api/call-outcome', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  }).then(x2 => x2.json()).catch(e => ({ ok: false, why: e.message }));
  return r;
};

function CallOutcomeBar({ lead }) {
  const [done, setDone] = React.useState(lead.callOutcome || '');
  const [busy, setBusy] = React.useState('');
  const [said, setSaid] = React.useState('');
  const [when, setWhen] = React.useState('');
  const [next, setNext] = React.useState('');
  const [err, setErr] = React.useState('');
  const save = async (outcome, extra) => {
    setBusy(outcome); setErr('');
    const r = await recordOutcome(lead, outcome, extra || { said });
    setBusy('');
    if (r && r.ok) {
      setDone(outcome);
      // Kept on the lead too, so a reload shows what already happened and the
      // same call is not logged twice.
      try {
        const all = getLeads(); const i = all.findIndex(x => x.id === lead.id);
        if (i >= 0) { all[i].callOutcome = outcome; all[i].callOutcomeAt = new Date().toISOString(); saveLeads(all, all[i]); }
      } catch (e) { console.log('could not stamp the lead:', e.message); }
    } else {
      setErr((r && r.why) || 'the outcome could not be stored');
    }
  };
  const needsFollowUp = done === 'callback';
  return React.createElement('div', {
    style: { marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--b)' },
  },
    React.createElement('div', { style: { fontSize: 10, fontWeight: 700, letterSpacing: '.07em', textTransform: 'uppercase', color: 'var(--m)', marginBottom: 6 } },
      done ? 'Logged \u2014 ' + done.replace(/_/g, ' ') : 'After the call'),
    React.createElement('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6 } },
      CALL_OUTCOME_LABELS.map(([k, label]) => React.createElement('button', {
        key: k,
        disabled: !!busy,
        onClick: () => save(k),
        style: {
          fontSize: 11, padding: '5px 10px', borderRadius: 99, cursor: busy ? 'wait' : 'pointer',
          border: '1px solid ' + (done === k ? 'var(--a)' : 'var(--b)'),
          background: done === k ? 'var(--a)' : 'transparent',
          color: done === k ? '#0b0d10' : 'var(--m2)',
          fontWeight: done === k ? 700 : 500,
        },
      }, busy === k ? '...' : label))),
    // Optional, and the most valuable field here: the outcome says WHICH
    // findings work, and only his own words say why one did not.
    React.createElement('input', {
      value: said, placeholder: 'What he actually said (optional, and the most useful thing you can capture)',
      onChange: e => setSaid(e.target.value),
      onBlur: () => { if (done && said.trim()) save(done, { said, followUpAt: when, nextStep: next }); },
      style: { marginTop: 7, width: '100%', fontSize: 12, padding: '6px 9px', borderRadius: 6, border: '1px solid var(--b)', background: 'transparent', color: 'var(--t)' },
    }),
    needsFollowUp ? React.createElement('div', { style: { display: 'flex', gap: 6, marginTop: 6 } },
      React.createElement('input', {
        type: 'date', value: when, onChange: e => setWhen(e.target.value),
        style: { fontSize: 12, padding: '6px 9px', borderRadius: 6, border: '1px solid var(--b)', background: 'transparent', color: 'var(--t)' },
      }),
      React.createElement('input', {
        value: next, placeholder: 'Next step', onChange: e => setNext(e.target.value),
        onBlur: () => { if (when || next) save('callback', { said, followUpAt: when, nextStep: next }); },
        style: { flex: 1, fontSize: 12, padding: '6px 9px', borderRadius: 6, border: '1px solid var(--b)', background: 'transparent', color: 'var(--t)' },
      })) : null,
    err ? React.createElement('div', { style: { fontSize: 11, color: 'var(--r)', marginTop: 5 } },
      'Not stored \u2014 ' + err + '. The call happened and the record did not, so write it down somewhere before you move on.') : null);
}

const criticalClaimsOf = (lead) => {
  const risks = ((lead && lead.brainAudit && lead.brainAudit._claimRisks) || (lead && lead._claimRisks) || []);
  return risks.filter(x => /\bCRITICAL\b/.test(String(x)));
};

// ══ THE SCREEN SAID DO NOT SEND THIS AND THE BUTTON SAID APPROVE ════════════
// Live, Donna Krummen: a red panel reading "NOTHING HERE IS WORTH A FIRST EMAIL
// — the strongest thing we found is a free fix he can do himself in an
// afternoon", and directly beneath it an enabled "Approve this email for Send".
//
// The panel and the button were reading different things. Approval was gated on
// fabrication alone, so the system's own verdict that this lead should not get a
// first email at all had no mechanical effect. A warning nobody is forced to act
// on is decoration, and this file's own rule is that guards must be mechanical.
//
// Three refusals, all already computed and all previously advisory:
//   CALL_INSTEAD  the best finding is arguable or has to be taken on trust
//   TOO_WEAK      the best finding is a free fix he does himself and never replies
//   tooThin       the body is under the word floor, and that IS everything this
//                 lead produced, so padding it would mean inventing
//
// One door: both Approve buttons read this, so a lead cannot be approved from
// one screen that another screen refuses.
const sendBlockersOf = (lead) => {
  const out = criticalClaimsOf(lead).map(x => 'CRITICAL claim: ' + String(x).slice(0, 160));
  const os = (lead && lead.brainAudit && lead.brainAudit.openerStrength) || null;
  if (os && os.verdict === 'CALL_INSTEAD') {
    out.push('work this one by phone \u2014 the strongest thing we found is something he has to take on trust or can argue with, and a cold email on it spends this domain\'s only first impression on him');
  }
  if (os && os.verdict === 'TOO_WEAK') {
    out.push('nothing here is worth a first email \u2014 the strongest thing we found is a free fix he can do himself in an afternoon, so he does it, feels fine, and never replies');
  }
  const ce = (lead && lead.composedEmail) || null;
  if (ce && ce.variantA && ce.variantA.tooThin) {
    out.push('the composed body came in under the word floor \u2014 nothing was trimmed, so that is everything this lead produced');
  }
  return out;
};

// Delete a lead from Supabase
// ══ A DELETE IS AN INTENTION, NOT A REQUEST ═════════════════════════════════
// The old body fired one sbFetch and hoped. sbFetch swallows every failure into
// a console.warn and returns null — and it ALSO returns null on a successful
// 204, so the caller cannot even tell which happened. Cloud wins at boot, so a
// delete that failed (offline, Supabase 5xx) silently resurrected the lead on
// the next refresh, which reads exactly like the dedupe bug already fought
// once. The id is now tombstoned in a small persistent ledger BEFORE the
// request; a confirmed 2xx clears it, anything else leaves it standing, and
// boot both filters tombstoned rows out of the cloud merge and retries their
// deletion. A lead Vin deleted stays deleted through any number of failures.

    const r = await fetch(SB_URL + '/rest/v1/leads?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',

// ── finalLeadScore — WHAT THE LEAD IS WORTH ONCE WE ACTUALLY KNOW ──────────
// The old rule was `min(discoveryScore + researchBonus, 100)`. Two things were
// wrong with it, and together they killed the ranking entirely.
//
// 1. IT SATURATED. Discovery already produces a well-spread 34-97. Adding a flat
//    +7..+10 and clamping at 100 pushed the whole top of the distribution into a
//    single value: measured over 3,000 simulated leads, the TOP 300 LEADS ALL
//    SHARED ONE SCORE. Every lead in the pipeline read 100/100, so the queue
//    looked ranked and was really being ordered by whatever the tie-break was.
//
// 2. IT COULD ONLY GO UP. Research is where we discover a lead is UNREACHABLE —
//    no owner, no deliverable address. That is the single most important thing
//    we learn, and the score moved in the wrong direction on it. A business we
//    cannot email is not a 100/100 lead no matter how good the company looks.
//
// So the post-research score is a BLEND of how good the company is (discovery)
// and whether we can actually reach the owner (reachability, which discriminates
// sharply and honestly: 18 / 34 / 40 / 58 / 64 / 74 / 92). Weighted toward the
// company, because reachability can improve on a re-run once credits are back,
// while a bad-fit company stays a bad fit.
//
// Measured against the old rule on the same population: 0% at the ceiling instead
// of 12%, 69 distinct scores instead of 57, and 16 distinct values across the top
// 300 instead of 1. Scores will read LOWER than before. They are not worse — they
// are finally telling you which lead to work first.
const finalLeadScore = (discoveryScore, reachability, researchBonus) => {
  const d = Math.max(0, Math.min(100, Number(discoveryScore) || 0));
  // No reachability in the response (older cached result, or research failed
  // before scoring) — fall back to the previous behaviour rather than invent a
  // number, but keep it off the ceiling so it cannot fake a perfect lead.
  if (typeof reachability !== 'number' || !isFinite(reachability)) {
    return Math.min(d + (Number(researchBonus) || 0), 97);
  }
  const r = Math.max(0, Math.min(100, reachability));
  return Math.max(1, Math.min(97, Math.round(0.55 * d + 0.45 * r)));
};

// ══ ONE MERGE FOR A RESEARCH RESULT, WHEREVER IT WAS RUN FROM ═══════════════
// This is the code that turns the server's answer into the lead row: ~200 lines
// of "which value wins", most of them written the day a specific field went
// missing on screen. It lived inside runResearch, so the only way to audit fifty
// businesses at once was to write it a second time.
//
// The comment this function grew out of says exactly why that must not happen:
// "Two implementations of one operation is the same mistake as the two
// fabrication lists and the two merge paths in this file's history. The second
// copy is always the one that rots, because it only runs in the case nobody
// tests." A batch runner is precisely a case nobody tests one lead at a time.
//
// It is PURE: it takes the previous row and the server's data, and returns the
// merged row plus what the screen should say. Saving, sorting and re-rendering
// stay with the caller, because a batch of fifty must not write to disk fifty
// times or re-render on every one.
//
//   prev    the lead row as it stands (mutated and returned)
//   data    the parsed body of the research response
//   ctx     { website, emailData, companyData, pageSpeed, httpStatus }
//   returns { lead, outcome: 'not_a_fit'|'brain_failed'|'researched', banner }
//

// save with `saveLeads(leads, ...)` — the whole array as it looked BEFORE the
// audit started. The success path stopped doing that months ago, and the comment
// explaining why is quoted at its call site: a stale array write erases whatever
// another run finished in the meantime. The refusal and brain-failure branches
// were still doing it. With one lead at a time that is a narrow window; with
// fifty in flight it is the common case.

        // ended "error in 0.0s (HTTP 422)". Nothing failed: the owner guard
        // deliberately refused the lead, because dtainsure.com is not named after
        // Dan Thompson, so he is one practitioner on a group's domain and cannot
        // buy what we sell. The guard saved ~13 Firecrawl credits and was right.

        // banner, same reset, same invitation to press Run Research again. So it
        // read as "the system keeps failing on this lead", and looked like a
        // concurrency problem when nothing was running concurrently at all.

        // occupying the queue, and does not ask to be retried — retrying a
        // deliberate refusal cannot ever produce a different result.

            '\u26d4 NOT A FIT \u2014 this lead was refused before any credits were spent, and re-running will refuse it again. '

        // fallback for when research returned nothing.
