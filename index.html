        if (data.email && emailData.email && data.email !== emailData.email) {
          console.log('EMAIL: research resolved ' + data.email + ' for the decision-maker; the cached address (' + emailData.email + ') belonged to someone else and has been replaced.');
        }
        // Same inversion, same consequence: the cached Hunter NAME outranked the
        // resolved decision-maker, so an email addressed to the owner could open
        // with a staff member's first name. The two must move together — an
        // address for Tom under a greeting to Patrick is worse than either alone.
        L.founderName = data.founderName || emailData.founderName || L.founderName || '';
        if (companyData.industry) L.industry = companyData.industry;
        if (companyData.employees) L.employees = String(companyData.employees);
        L.flaws = data.flaws || [];
        L.researchBonus = data.researchBonus || 0;
        const discoveryScore = L.preResearchScore || L.icpScore || 0;
        // `data.reachability`, NOT L.reachability — the lead's own copy is
        // not assigned until ~40 lines below this, so reading it here would blend
        // against the PREVIOUS run's number on every re-research.
        L.icpScore = finalLeadScore(discoveryScore, data.reachability, data.researchBonus);
        L.preResearchScore = discoveryScore;
        // ══ THIS USED TO OVERWRITE THE SERVER'S ANSWER WITH A DEAD ONE ═════
        // The browser's own PageSpeed call was removed further up this file (it
        // ran with no API key and returned 429 on every lead, which was being
        // recorded as a measurement). ctx.pageSpeed has been {} ever since, so
        // these two lines wrote "Not checked" and "" over whatever the server
        // had actually put in richData, on every lead, forever. An empty local
        // value must never beat a measured remote one — that is the same
        // inversion as the cached Hunter address winning over the resolved
        // decision-maker, forty lines below.
        //
        // Kept as a fallback, not an override: the browser value only fills the
        // row when the server did not send one.
        L.richData = { ...(data.richData || {}) };
        if (pageSpeed.mobileScore) L.richData.mobileScore = `${pageSpeed.mobileScore}/100 mobile score`;
        if (pageSpeed.lcp) L.richData.loadTime = pageSpeed.lcp;
        L.signals = {
          ...(L.signals || {}),
          ...(data.signals || {})
        };
        L.buckets = data.buckets || null;
        L.topPain = data.topPain || null;
        L.recommendedProduct = data.recommendedProduct || null;
        L.brainAudit = data.brainAudit || null;
        // ══ AND THE FLAT COPY THE UI ACTUALLY READS ══════════════════════
        // brainAudit alone was written here. The audit screen renders
        // lead.problemList, the compose payload reads lead.harmsRanked, and the
        // save path serialises lead.factualSpine — all flat, none of them
        // touched by this merge. Only a page reload put them there, via
        // rowToLead, which is why a finished run left the previous run's
        // findings on screen underneath the new run's narrative.
        //
        // Same function rowToLead uses, so the two paths cannot disagree about
        // which fields are measured or where they come from.
        Object.assign(L, measuredFieldsFrom(data.brainAudit));
        // ── THE AUDIT'S MEASUREMENTS ─────────────────────────────────────
        // THIS is the merge path that actually runs after research. The other
        // one further down is a different branch, and fixing only that one meant
        // these fields still never landed on the lead \u2014 so the call sheet showed
        // "nothing on file" while the email in the same view correctly quoted
        // "32 reviews at 4.7 stars". Written here, they survive.
        L.offerStrength = data.offerStrength ?? L.offerStrength ?? null;
        L.sitePages = data.sitePages ?? L.sitePages ?? null;
        L.htmlSignals = data.htmlSignals ?? L.htmlSignals ?? null;
        L.gbpHealth = data.gbpHealth ?? L.gbpHealth ?? null;
        L.socialPresence = data.socialPresence ?? L.socialPresence ?? null;
        L.marketClarity = data.marketClarity ?? L.marketClarity ?? null;
        L.leadMagnet = data.leadMagnet ?? L.leadMagnet ?? null;
        L.valueEquation = data.valueEquation ?? L.valueEquation ?? null;
        L.theOneThing = data.theOneThing ?? L.theOneThing ?? null;
        L.adsTransparency = data.adsTransparency ?? L.adsTransparency ?? null;
        // What moved between two looks at this business. The only facts in the
        // system with a date on them that did not come from a job board, and
        // most of them are internal-only, which is exactly what a person on a
        // cold call wants in front of him.
        L.whatChanged = data.whatChanged ?? L.whatChanged ?? null;
        // The industry brief for this segment. Framing and vocabulary for the
        // person making the call; the server has already barred it from email.
        L.nicheBrief = data.nicheBrief ?? L.nicheBrief ?? null;
        L.researchedAt = data.researchedAt ?? L.researchedAt ?? null;
        L.callWindow = data.callWindow ?? L.callWindow ?? null;
        // Only overwrite when the incoming one actually has results. A merge that
        // takes an empty object over good persisted data is how a working lead
        // turns into "nothing on file".
        L.localVisibility = (data.localVisibility && data.localVisibility.checked)
          ? data.localVisibility : (L.localVisibility || null);
        L.candidateFindings = data.candidateFindings ?? L.candidateFindings ?? null;
        L.ownerReplyCount = data.ownerReplyCount ?? L.ownerReplyCount ?? null;
        L.reviewsRead = data.reviewsRead ?? L.reviewsRead ?? null;
        L.leadSignal = data.leadSignal ?? L.leadSignal ?? null;
        // ── INSTANCE EIGHTEEN OF COMPUTED-BUT-NOT-PASSED ─────────────────
        // detectLSA() runs on EVERY researched lead and costs ZERO credits — it
        // reads the homepage we already scraped. It is returned by the server,
        // persisted and restored. It was never written here, on the merge path
        // that actually runs, so the Research tab has shown "Google LSA — Not
        // checked. Re-run Research to check." on every lead tonight, including
        // attorneys, which ARE an LSA category. Re-running could never fix it.
        //
        // A row that says "not checked" forever on an audit whose entire claim is
        // "we only say what we measured" is worse than a missing row: it advertises
        // a check we perform and silently never report.
        L.lsa = data.lsa ?? L.lsa ?? null;
        // ══ ELEVEN MORE, FOUND BY CHECKING THE SERVER'S OWN CONTRACT ═══════
        // The comment above this line calls the lsa field "instance eighteen of
        // computed-but-not-passed". It was found the way all seventeen before it
        // were found: somebody looked at a screen and noticed a row that said
        // "Not checked" forever. That is not a method, and it had missed these.
        //
        // clientcheck.js now reads the field list off the SERVER's own res.json
        // and executes this merge against it, so the requirement comes from the
        // thing that produces the data rather than from this file. It reported
        // eleven fields the server computes, pays for and returns on every lead,
        // that nothing here ever wrote down. Five of them are rendered by the UI
        // right now:
        //
        //   fullPageUrl, pageShots   the full-page renders. The audit view reads
        //                            both and says "above the fold only" without
        //                            them — on every lead, because leadToRow
        //                            persists them FROM THE LEAD, so a value that
        //                            never lands here is stored as null and comes
        //                            back null. Not dark until reload. Gone.
        //   verifiedCEO, verifiedCEOTitle
        //                            the confirmed decision-maker and their
        //                            title, on the call sheet. leadToRow's own
        //                            comment calls verifiedCEO "the costly one"
        //                            because scoreReachability reads it.
        //   rateLimited              the banner that says Firecrawl was REFUSED
        //                            rather than finding nothing, and to re-run
        //                            the lead. Exactly the case where a missing
        //                            warning reads as a clean result.
        //   phoneSource              whether the number came off their Google
        //                            listing.
        //
        // The other five are measured and had nowhere to go: Google's real-world
        // speed field data, and the early-channel decision that records whether
        // the paid audit was skipped and why.
        L.fullPageUrl = data.fullPageUrl ?? L.fullPageUrl ?? null;
        L.pageShots = Array.isArray(data.pageShots) ? data.pageShots : (L.pageShots || []);
        L.verifiedCEO = data.verifiedCEO || L.verifiedCEO || null;
        L.verifiedCEOTitle = data.verifiedCEOTitle || L.verifiedCEOTitle || null;
        L.founderTitle = data.founderTitle || L.founderTitle || '';
        L.rateLimited = data.rateLimited ?? L.rateLimited ?? null;
        L.phoneSource = data.phoneSource || L.phoneSource || '';
        L.realSpeed = data.realSpeed ?? L.realSpeed ?? null;
        // Two-listings measurement: the call sheet's mechanical explanation for
        // an outranked finding. clientcheck.js flagged this line's absence the
        // moment the server started returning the field — the executable merge
        // check doing the job it was built for.
        L.duplicateListing = data.duplicateListing ?? L.duplicateListing ?? null;
        L.earlyChannel = data.earlyChannel || L.earlyChannel || '';
        L.earlyChannelReason = data.earlyChannelReason || L.earlyChannelReason || '';
        L.auditSkippedForChannel = data.auditSkippedForChannel ?? L.auditSkippedForChannel ?? null;
        L.outreachChannel = data.outreachChannel ?? L.outreachChannel ?? null;
        L.valueEquation = data.valueEquation ?? L.valueEquation ?? null;
        L.theOneThing = data.theOneThing ?? L.theOneThing ?? null;
        L.adsTransparency = data.adsTransparency ?? L.adsTransparency ?? null;
        // What moved between two looks at this business. The only facts in the
        // system with a date on them that did not come from a job board, and
        // most of them are internal-only, which is exactly what a person on a
        // cold call wants in front of him.
        L.whatChanged = data.whatChanged ?? L.whatChanged ?? null;
        // The industry brief for this segment. Framing and vocabulary for the
        // person making the call; the server has already barred it from email.
        L.nicheBrief = data.nicheBrief ?? L.nicheBrief ?? null;
        L.researchedAt = data.researchedAt ?? L.researchedAt ?? null;
        L.callWindow = data.callWindow ?? L.callWindow ?? null;
        L.marketClarity = data.marketClarity ?? L.marketClarity ?? null;
        L.leadMagnet = data.leadMagnet ?? L.leadMagnet ?? null;
        L.offerStrength = data.offerStrength ?? L.offerStrength ?? null;
        L.growthConstraint = data.growthConstraint || L.growthConstraint || null;
        L.situationRead = data.situationRead ?? L.situationRead ?? null;
        L.affordability = data.affordability || L.affordability || null;
        L.reviewCount = data.reviewCount ?? (data.gbpHealth && data.gbpHealth.reviewCount) ?? L.reviewCount ?? null;
        L.rating = data.rating ?? (data.gbpHealth && data.gbpHealth.rating) ?? L.rating ?? null;
        L.industry = data.verifiedIndustry || L.industry || '';
        L.phone = data.phone || L.phone || '';
        L.phoneDisplay = data.phoneDisplay || L.phoneDisplay || '';
        L.topThreeProducts = (data.brainAudit && data.brainAudit.topThreeProducts) || [];
        L.positioningScore = data.positioningScore || null;
        L.homepageContent = data.homepageContent || '';
        L.screenshotUrl = data.screenshotUrl || null;
        L.visualAnalysis = data.visualAnalysis || null;
        L.companyTriggers = data.companyTriggers || [];
        L.auditedWebsite = data.auditedWebsite || '';
        L.auditedWebsiteResolved = data.auditedWebsiteResolved || false;
        L.domainMatch = data.domainMatch || 'unknown';
        L.domainMatchConfidence = data.domainMatchConfidence || 'low';
        L.domainMatchReason = data.domainMatchReason || '';
        L.visionAudit = data.visionAudit || null;
        L.signalConfidence = data.signalConfidence || null;
        L.publicPainSignals = data.publicPainSignals || [];
        L.painSummary = data.painSummary || '';
        L.reachabilityVerdict = data.reachabilityVerdict || '';
        L.decisionMaker = data.decisionMaker || null;
        L.emailResult = data.emailResult || null;
        if (data.verifiedRevenue) L.verifiedRevenue = data.verifiedRevenue;
        if (data.verifiedEmployees) L.verifiedEmployees = data.verifiedEmployees;
        L.firecrawlOutOfCredits = data.firecrawlOutOfCredits || false;
        // Reachability is now computed properly by the backend (owner-identification +
        // email as the spine, size as a modifier, hard cap when no owner is found).
        // Use it verbatim — do NOT override with a crude local heuristic.
        if (data.localVisibility) L.localVisibility = data.localVisibility;
        if (data._claimRisks) L._claimRisks = data._claimRisks;
        // These three were computed and returned by the server but never copied
        // onto the lead, so their audit rows always read "Not checked"/"Not
        // assessed" no matter what was actually measured. Same wiring shape as
        // the _claimRisks bug: an explicit copy list that a new field was never
        // added to. Positioning in particular is available on EVERY lead, so
        // this silently hid the one finding that always exists.
        if (data.positioningRead) L.positioningRead = data.positioningRead;
        if (data.gbpHealth) L.gbpHealth = data.gbpHealth;
        if (data.htmlSignals) L.htmlSignals = data.htmlSignals;
        if (typeof data.reachability === 'number') L.reachability = data.reachability;
        if (data.reachabilityReasons && data.reachabilityReasons.length) L.reachabilityReasons = data.reachabilityReasons;
        L.reachabilityVerified = !!(data.decisionMaker && data.decisionMaker.corroborated);
        L.ownerEmailMatch = data.ownerEmailMatch || 'unknown';
        L.ownerEmailMatchReason = data.ownerEmailMatchReason || '';
        // ══ A NEW AUDIT INVALIDATES THE OLD EMAIL AND ITS APPROVAL ═════════
        // Live: Broderick was researched again, the run completed cleanly, and
        // clicking Generate showed "Generate — Overhead Door Company of Denver".
        // He was APPROVED from an earlier session, so the Generate queue — which
        // holds only unapproved leads by design — excluded him, and the view fell
        // through to the first lead in the list.
        //
        // The display was a symptom. The real problem is that he was still sitting
        // in Send, approved, carrying an email written from the PREVIOUS audit,
        // while the audit that had just replaced it was invisible. Approving copy
        // is approving THAT copy against THAT evidence; when the evidence is
        // re-measured, the approval no longer refers to anything. On this very
        // lead the new audit changed the lead finding, the wording and the
        // supporting numbers — so the approved email described a different
        // diagnosis from the one now on file.
        //
        // Re-research therefore returns a lead to the Generate queue and drops the
        // stale draft. Nothing is silently lost: the email is regenerated from the
        // new audit, which is the only version that matches what we now know.
        const _wasApproved = !!L.approved;
        const _hadDraft = !!L.generatedResult;
        // ══ A RE-RESEARCHED SENT LEAD FELL INTO A DEAD STATE ═════════════════
        // The guard below protects a SENT lead's approval so it does not reappear
        // as unsent. But the line after it sets status='researched' regardless —
        // so the lead ends up researched AND approved, and Generate filters on
        // (researched|generated) AND NOT approved. It matched nothing.
        //
        // Live on Property Masters: sent earlier, re-researched, then "Write the
        // email" moved to Generate and the lead was not in the queue.
        //
        // Re-running Research is an explicit decision to work this lead again, and
        // the new audit invalidates whatever the old email said. So the approval
        // is cleared in every case and the draft goes with it — the send itself is
        // already recorded in sentSnapshot, which is what Call reads, so nothing
        // about the history is lost.
        //
        // ══ AND IT HAS TO CLEAR THE WHOLE EMAIL, NOT THREE FIELDS OF IT ═══
        // This cleared approved, generatedResult and copyFlags. applyGeneratedEmail
        // writes ELEVEN fields, and the two it leaves behind — `subject` and
        // `pitch` — are the two the send path actually reads. So a re-researched
        // lead carried the previous audit's subject line and body, under a fresh
        // audit, in the fields that mail.
        //
        // Nothing could ship it on its own: approved goes false and the lead has
        // to pass through Generate again. But "the draft is dropped" is what the
        // comment above promises and what the batch run relies on, and a lead
        // whose compose was REFUSED by the fact-checker would otherwise sit there
        // holding the exact copy that was refused. Found by running fifty leads
        // through the batch with a blocked composer, not by reading this.
        //
        // The list mirrors applyGeneratedEmail's writes exactly, and
        // clientcheck.js fails the build if the two ever drift apart — that is
        // the only way this stays true when a twelfth field is added.
        L.approved = false;
        L.generatedResult = null;
        L.composedEmail = null;
        L.pitch = null;
        L.subject = null;
        L.abVariant = null;
        // The ask arm and its page. A re-research re-measures the findings, so
        // the stored page describes a business we no longer believe in — and
        // leaving the URL behind means the next send links a stranger to the
        // PREVIOUS audit. Cleared with the rest of the draft.
        L.ctaMode = null;
        L.pageUrl = null;
        L.followUp1 = null;
        L.followUp2 = null;
        L.breakup = null;
        L.copyFlags = null;
        L.promptPath = null;
        L.status = 'researched';
        if (_wasApproved || _hadDraft) {
          console.log('[re-research] ' + (L.company || 'lead') +
            ': cleared a previous ' + (_wasApproved ? 'approval' : 'draft') +
            ' — the email it referred to was written from the old audit. Back in Generate for a fresh write.');
        }
        return { lead: L, outcome: 'researched', banner: '' };
};


// ══ ONE COMPOSE REQUEST, BUILT IN ONE PLACE ═════════════════════════════════
// Same reason as buildResearchBody one function above: this payload was an
// object literal inside a 1,500-line React handler, so the only way to write an
// email for fifty leads at once was to write the payload a second time. Every
// comment inside it records a live send that went wrong because one field was
// missing or read from the wrong place — the greeting that used the operations
// director's name, the problem list read from the one location that does not
// survive a refresh, the trade word that decides the money sentence. A second
// copy would start without any of them.
//
// Pure: lead in, request body out. clientcheck.js fails the build if a second
// one appears or if a caller writes its own.
const buildComposeBody = (lead, settings) => {
  lead = lead || {};
  settings = settings || {};
  const _ba = lead.brainAudit || {};
  return {
            company: lead.name,
            // ══ WITHOUT THIS THE MODEL NEVER WRITES ═══════════════════════
            // The server hands the verified pieces to the model and lets it
            // connect them into prose, then checks every figure and every
            // claim before allowing it. No key means no writer, and the email
            // silently stays in its assembled form — working, but the exact
            // thing the writer exists to fix. Same key every other call uses.
            apiKey: settings.apiKey,
            // ══ GREET THE PERSON THE EMAIL IS ADDRESSED TO ═══════════════════
            // Live on Hannah Custom Homes: the email went TO
            // dusty@hannahcustomhomes.com and opened "Kacie — 39 reviews across
            // 21 years". Kacie Carrico is the COO. Dusty Hannah is the owner.
            //
            // founderName is whatever discovery captured first and is never
            // rewritten when the decision-maker resolves. Research had already
            // corroborated Dusty three ways and built his mailbox, but the
            // greeting still read the stale field — the computed-but-not-passed
            // failure again, this time on the most visible line in the email.
            //
            // Addressing an owner by his operations director's name is worse
            // than using no name: it is proof the message is automated, on the
            // first four characters he reads. The confirmed decision-maker wins;
            // founderName is only the fallback when nothing was confirmed.
            // decisionMaker is an OBJECT — { name, title, corroborated } — and
            // verifiedCEO may be either an object or a plain string depending on
            // which path stored it. Passing the object straight through produced
            // "[object Object] — 39 reviews across 21 years" in a live email,
            // because the composer takes the first word of whatever it is given.
            // Line 3289 in this same file already reads `.name`; this did not.
            // Read the name off either shape, and never pass a non-string.
            founderName: (() => {
              const nameOf = (v) => {
                if (!v) return '';
                if (typeof v === 'string') return v.trim();
                if (typeof v === 'object' && typeof v.name === 'string') return v.name.trim();
                return '';
              };
              return nameOf(lead.verifiedCEO) || nameOf(lead.decisionMaker) || nameOf(lead.founderName) || '';
            })(),
            // ══ THE TRADE, FOR AUDITS STORED BEFORE IT SHIPPED ═══════════
            // tradeJobValue() keys off this to write the money sentence. It is
            // now included in measuredNumbers, but every lead researched before
            // that reports "NO money (tradeWord=null)" and loses the third of
            // the three elements the pitch must carry.
            //
            // The lead itself has carried the trade the whole time — it is what
            // the Research header prints under the company name. Sending it
            // means ~200 already-researched leads get the loss figure without
            // re-running Research and re-spending the credits.
            // Round-trip the brain's pattern line so a recompose keeps it.
            // Without this the sentence exists on the server, survives
            // persistence, and then vanishes the first time you hit
            // Regenerate — the exact shape of every field this system has
            // lost before.
            patternLine: (_ba && _ba.patternLine) || lead.patternLine || '',
            tradeWord: lead.industry || lead.verifiedIndustry || '',
            // ══ THE ARM WAS ASSIGNED AND NEVER SENT ═══════════════════════
            // The compose route picks which variant the prospect simulator
            // judges with `req.body.abVariant === 'B' ? variantB : variantA`,
            // and this builder never sent the field — so the simulator has
            // always read arm A, including on every lead the app had assigned
            // to arm B. Both arms carry the same body and different subjects,
            // so the subject actually judged could differ from the one that
            // shipped, and nothing recorded which arm went out against what
            // came back.
            //
            // That is the prerequisite for any reply-rate test: without it the
            // two-arm machinery cannot produce a readable result no matter how
            // many are sent.
            abVariant: lead.abVariant || 'A',
            // The ask arm is a stable hash of the lead id, so the id has to
            // travel. Without it every lead hashes the same empty string and the
            // whole test collapses into one arm.
            leadId: lead.id || '',
            // Where a reply goes if the reader uses the page's reply button
            // rather than the email. Same mailbox the send goes out from.
            replyTo: settings.fromEmail || settings.hunterFromEmail || '',
            // ══ THE LADDER IS ON THE LEAD, NOT ALWAYS ON THE AUDIT ═══════
            // Fresh from research these ride inside brainAudit. After a
            // reload, rowToLead restores them to the LEAD — problemList,
            // harmsRanked, factualSpine, measuredNumbers, subjectOptions and
            // allowedReframes are all top-level fields there.
            //
            // Sending lead.brainAudit alone therefore looked, to the server,
            // exactly like a lead with nothing measured on it: it answered
            // "neither a factual spine nor a stored harm ladder" on a lead
            // whose audit screen was at that moment rendering its problem list
            // from lead.problemList. The data was never missing; it was being
            // read from the one place it does not survive a refresh.
            //
            // The spine read a few lines below already checks both locations.
            // This payload did not, which is the same one-of-two-merge-paths
            // gap that has produced "nothing on file" before.
            brainAudit: Object.assign({}, _ba, {
              harmsRanked: (Array.isArray(_ba.harmsRanked) && _ba.harmsRanked.length) ? _ba.harmsRanked : (lead.harmsRanked || []),
              ladderInputs: _ba.ladderInputs || lead.ladderInputs || null,
              problemList: (Array.isArray(_ba.problemList) && _ba.problemList.length) ? _ba.problemList : (lead.problemList || []),
              factualSpine: _ba.factualSpine || lead.factualSpine || null,
              measuredNumbers: _ba.measuredNumbers || lead.measuredNumbers || null,
              subjectOptions: (Array.isArray(_ba.subjectOptions) && _ba.subjectOptions.length) ? _ba.subjectOptions : (lead.subjectOptions || []),
              allowedReframes: (Array.isArray(_ba.allowedReframes) && _ba.allowedReframes.length) ? _ba.allowedReframes : (lead.allowedReframes || []),
            }),
  };
};

// ══ AND ONE READING OF WHAT COMES BACK ══════════════════════════════════════
// The composer answers in four shapes and each means something different: an
// email, "this audit predates the composer", "I refuse because the audit
// contradicts the measurements", and "I could compose a body but not a subject,
// so this could not be sent". Three of the four are NOT errors and the third is
// the one that must never fall through to a stored draft — that is how a
// refused email would have been shown as current. Read once, here, so the batch
// runner and the Generate panel cannot disagree about which is which.
const readComposeResponse = (j) => {
  if (j && j.composed && j.composed.variantA) {
    // Which ask this lead was given, and the page it points at. Carried out of
    // the response so it can be stored on the lead: a reply arrives days later
    // and the arm is the only thing that makes it mean anything. The existing
    // subject A/B has been running without this since it was built, which is why
    // it has never produced a readable result.
    return { composed: j.composed, blocked: null, ctaMode: j.ctaMode || null, pageUrl: j.pageUrl || null,
      note: 'the server composed this email from the existing audit. No model call.' };
  }
  if (j && j.reason === 'no-spine') {
    return { composed: null, blocked: null, note: 'this audit has no factual spine \u2014 it predates the composer. Re-run Research on this lead to get the composed email; falling back to the model for now.' };
  }
  if (j && j.reason === 'critical-fact-check') {
    return { composed: null, blocked: j, note: 'blocked \u2014 ' + ((j.criticalFlags || []).length) + ' claim(s) contradict the measurements.' };
  }
  if (j && j.reason === 'no-subject') {
    return { composed: null, blocked: null, note: 'the server composed a measured body for this lead but could not build a subject line for it, so it refused to hand back an email that could not be sent. Re-run Research on this lead. Falling back to the model for now.' };
  }
  return { composed: null, blocked: null, note: '' };
};


// ══ ONE PLACE AN EMAIL BECOMES A LEAD ═══════════════════════════════════════
// Lifted out of commitGeneratedEmail for the same reason as the research merge:
// the batch runner writes emails for fifty leads and has no React state, so
// without this it would need a second copy of every rule below. The comment
// this grew out of is the argument in full — two producers had grown separate
// vocabularies, one writing fields nothing read, and five faults were queued
// behind the visible one. That happened once. It does not need to happen again
// because a batch button was added.
//
// Pure: previous lead in, merged lead out. No saving, no re-render, no error
// state. The caller decides what to do with { ok, error }.
const applyGeneratedEmail = (prev, raw, opts) => {
  const L = prev || {};
  opts = opts || {};
  // Stamped before anything else so a later refusal cannot leave the lead
  // claiming an arm it was never actually sent under.
  if (opts.ctaMode) L.ctaMode = opts.ctaMode;
  if (opts.pageUrl !== undefined) L.pageUrl = opts.pageUrl || null;
  // ── NORMALISE ──────────────────────────────────────────────────────────────
  // `pitch` is this application's word for the body. The server composer says
  // `body`. Accept either, emit `pitch`, so a producer cannot be wrong about a
  // field name again — it can only be missing content, which is visible.
  const _v = (v) => {
    if (!v || typeof v !== 'object') return null;
    const pitch = String(v.pitch || v.body || '').trim();
    const subject = String(v.subject || '').trim();
    return (pitch || subject) ? { ...v, subject, pitch } : null;
  };
  const result = raw ? {
    ...raw,
    variantA: _v(raw.variantA),
    variantB: _v(raw.variantB),
    followUp1: raw.followUp1 || null,
    followUp2: raw.followUp2 || null,
    breakup: raw.breakup || null,
  } : null;
  if (!result || !result.variantA || !result.variantA.pitch) {
    // Refuse rather than render an empty email. A blank panel with no
    // explanation is what sent us looking in the wrong place for a week.
    return { ok: false, lead: L, result: null, variant: 'A',
      error: 'The email came back with no body. Nothing was written to this lead \u2014 re-run Research on it, then Generate.' };
  }

  L.generatedResult = result;
  // ══ THE CAPTION READS composedEmail; THE COMMIT WROTE generatedResult ══
  // The provenance caption (and its refusal read-out) looks at
  // lead.composedEmail — which held the RESEARCH-time composed object, frozen
  // before the brain ever saw the lead. So a brain-written email rendered under
  // "no model wrote any part of this email", and a refusal's reason
  // (composed.brainWriter, sent by the server since 2026-08-18) had nowhere to
  // land. Same object, newer version, same slot: the caption now reads what
  // actually shipped. writtenBy and brainWriter both survive _v's normalisation
  // because it spreads the original variant through.
  L.composedEmail = result;

  // ── DETERMINISTIC A/B ASSIGNMENT ───────────────────────────────────────────
  // Derived from the lead id rather than random, so it is stable: regenerating
  // cannot flip it, which would otherwise scramble the attribution recorded at
  // send time.
  const _abHash = String(L.id || '')
    .split('').reduce((h, c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 0);
  const _useB = Math.abs(_abHash) % 2 === 1 && result.variantB && result.variantB.subject;
  const _chosen = _useB ? result.variantB : result.variantA;

  L.pitch = _chosen && _chosen.pitch;
  L.subject = _chosen && _chosen.subject;
  L.abVariant = _useB ? 'B' : 'A';
  L.followUp1 = result.followUp1 || null;
  L.followUp2 = result.followUp2 || null;
  L.breakup = result.breakup || null;
  // ── FLAGS BELONG TO THIS EMAIL, NOT THE LAST ONE ───────────────────────────
  // The model path read callClaude.lastCopyFlags. That global still holds the
  // previous lead's flags when no model call was made, so a composed email would
  // have inherited warnings written about somebody else's copy. Flags are passed
  // in explicitly and default to none.
  L.copyFlags = Array.isArray(opts.copyFlags) ? opts.copyFlags : [];
  L.promptPath = opts.promptPath || 'unknown';
  result._copyFlags = L.copyFlags;
  // Do NOT touch icpScore — it is the discovery+research score, and the
  // pitch-writer's opinion must never corrupt the real pipeline score.
  L.status = 'generated';
  return { ok: true, lead: L, result, variant: _useB ? 'B' : 'A', error: '' };
};

const researchViaQueue = async (body, opts) => {
  const o = opts || {};
  // RESUME: poll a job that was already accepted, instead of starting a new one.
  // This is what makes leaving the view non-destructive — and it costs nothing,
  // because the credits were already spent when the job was submitted.
  if (o.resumeJobId) {
    return pollResearchJob(o.resumeJobId, o);
  }
  const submit = await fetch(BACKEND + '/api/research-async', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal: o.signal,
  });
  if (!submit.ok) {
    // Older backend that predates the queue — fall back to the synchronous route
    // so a stale deploy degrades instead of breaking.
    if (submit.status === 404) {
      console.log('research queue not available on this backend — using the synchronous route');
      return fetch(BACKEND + '/api/research', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body), signal: o.signal,
      });
    }
    return submit;
  }
  const { jobId } = await submit.json();
  if (!jobId) return { ok: false, status: 500, json: async () => ({ error: 'Server accepted the job but returned no job id.' }) };
  if (typeof o.onJobId === 'function') o.onJobId(jobId);
  return pollResearchJob(jobId, o);
};

// ══ FIFTY AT A TIME ═════════════════════════════════════════════════════════
// Mike wants fifty audits a day for the sales guy, audits only, no emails. The
// app could research exactly one lead at a time, from a detail view, with a
// spinner — so fifty meant fifty clicks and fifty waits.
//
// This is the whole batch: it does NOT reimplement anything. It calls the same
// request builder, the same queue, the same merge and the same email commit the
// single-lead path uses, in that order, for each lead. Everything it needed had
// to be lifted to module scope first, and that was the actual work — the merge
// alone was two hundred lines inside a React function.
//
// WHY THE SERVER-SIDE QUEUE IS NOT ENOUGH ON ITS OWN. The server already limits
// how many leads run at once (RESEARCH_CONCURRENCY, plus a gate that refuses to
// start another while resident memory is near Render's ceiling). Submitting all
// fifty at once would therefore be SAFE server-side — it would just queue them.
// It would not be safe here: fifty browser poll loops, and fifty job ids whose
// only record is a tab that might be closed. So the pool is small and the ids
// are written to disk as they are issued, exactly as the single-lead path does.
//
// NO BROWSER LOOKUPS. The single-lead path runs Hunter from the browser with a
// per-domain cache, because it was written before the server resolved addresses
// itself. Doing that fifty times would spend a whole month of a 50-credit plan
// in one press. The server resolves the decision-maker and builds the mailbox,
// and its answer already outranks the cached one in the merge — so the batch
// sends no browser data at all and takes the server's answer.
//
// EMAILS ARE OPTIONAL AND OFF BY DEFAULT, because Mike asked for audits. When
// they are on, a lead whose audit contradicts its own measurements is reported
// as BLOCKED rather than quietly left with its previous draft standing.
const BATCH_DEFAULT_SIZE = 50;
const BATCH_CONCURRENCY = 3;

const runBatchAudit = async (opts) => {
  const o = opts || {};
  const queue = (o.leads || []).slice();
  const settings = o.settings || {};
  const withEmail = !!o.withEmail;
  const conc = Math.max(1, Math.min(8, Number(o.concurrency) || BATCH_CONCURRENCY));
  const stopped = () => !!(typeof o.shouldStop === 'function' && o.shouldStop());
  // A throwing progress callback must not kill the run: the batch is the
  // expensive half and a render error in the panel is the cheap half.
  const report = (ev) => { try { if (typeof o.onProgress === 'function') o.onProgress(ev); } catch (e) { console.warn('[batch] progress handler threw', e); } };

  // Re-read immediately before writing and patch only THIS lead. Fifty runs
  // finishing at different times is precisely the case where writing back a
  // snapshot taken minutes ago erases whatever finished in between — the bug
  // recorded at the single-lead merge, which only ever had three in flight.
  const persist = (row) => {
    const fresh = getLeads();
    const fi = fresh.findIndex(x => x.id === row.id);
    if (fi >= 0) fresh[fi] = row; else fresh.push(row);
    saveLeads(fresh, row);
    return row;
  };

  const total = queue.length;
  const results = new Array(total);
  let started = 0, finished = 0;

  const one = async (lead) => {
    const base = { id: lead.id, name: lead.name || lead.company || lead.id };
    let row = lead;
    try {
      const r = await researchViaQueue(
        buildResearchBody(lead, settings, { website: lead.website || '', forceRefresh: false, browserData: null }),
        { onJobId: (jid) => setInflightJob(lead.id, jid) }
      );
      const data = await r.json();
      // The row as it stands NOW, not as it stood when the batch was assembled.
      const cur = getLeads().find(x => x.id === lead.id) || { ...lead };
      const merged = applyResearchResult(cur, data, {
        website: lead.website || '', emailData: {}, companyData: {}, pageSpeed: {}, httpStatus: r.status,
      });
      row = persist(merged.lead);
      clearInflightJob(lead.id);
      if (merged.outcome !== 'researched') return { ...base, outcome: merged.outcome, note: merged.banner };
      if (!withEmail) return { ...base, outcome: 'researched', note: '' };
    } catch (e) {
      clearInflightJob(lead.id);
      return { ...base, outcome: 'error', note: (e && e.message) || String(e) };
    }

    try {
      const cr = readComposeResponse(await (await fetch(BACKEND + '/api/compose-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildComposeBody(row, settings)),
      })).json());
      if (cr.blocked) {
        return { ...base, outcome: 'email_blocked', note:
          ((cr.blocked.criticalFlags || []).length || 'one or more') + ' claim(s) in this audit contradict what we measured, so nothing was written. '
          + String((cr.blocked.criticalFlags || [])[0] || '').slice(0, 200) };
      }
      if (!cr.composed) return { ...base, outcome: 'audited_no_email', note: cr.note };
      const g = applyGeneratedEmail(row, cr.composed, { promptPath: 'composed', copyFlags: [], ctaMode: cr.ctaMode, pageUrl: cr.pageUrl });
      if (!g.ok) return { ...base, outcome: 'audited_no_email', note: g.error };
      persist(g.lead);
      return { ...base, outcome: 'generated', note: '' };
    } catch (e) {
      // The audit is saved either way. An email that could not be written is a
      // lead to press Generate on, not a lead to research again.
      return { ...base, outcome: 'audited_no_email', note: 'the composer could not be reached (' + ((e && e.message) || e) + '); the audit is saved, press Generate on this lead' };
    }
  };

  const worker = async () => {
    for (;;) {
      if (stopped()) return;
      const i = started++;
      if (i >= total) return;
      report({ phase: 'start', lead: queue[i], index: i, total, finished });
      const res = await one(queue[i]);
      results[i] = res;
      finished++;
      report({ phase: 'done', lead: queue[i], index: i, total, finished, result: res });
    }
  };

  await Promise.all(Array.from({ length: Math.min(conc, total) }, worker));
  return results.filter(Boolean);
};

// ══ EXPORTING FIFTY AUDITS WITHOUT MAKING A SECOND COPY OF THE AUDIT ════════
// After a bulk run there are fifty audits on screen and no way to get them out.
// The obvious build is a formatter that walks a lead and writes out the sections
// — and that is a SECOND implementation of the audit, which this file's own
// history says is the one that rots, because it only runs in the case nobody
// tests. leadToRow produced nine duplicate-key collisions that way, and the
// research merge was written twice before it was made one function.
//
// So there are two pieces and only the first knows anything about an audit:
//   auditRecordFor   lead -> plain data. ONE place that says what an audit is.
//   auditExportHtml  that data -> a page. Knows nothing about leads.
// A boot-time check in clientcheck.js runs auditRecordFor against a lead built
// from the server's own response shape and asserts every section arrives.
//
// HTML rather than CSV or PDF, deliberately: an audit is prose with structure,
// a spreadsheet destroys it, and a PDF needs a library. One file, no assets, no
// network — it opens on any machine, prints to PDF from the browser, and cannot
// half-load. That is what "nothing gets ruined" has to mean for a file that
// leaves this app and gets emailed around.
const auditRecordFor = (lead) => {
  const l = lead || {};
  const ba = l.brainAudit || {};
  const sr = (l.situationRead && typeof l.situationRead === 'object') ? l.situationRead : null;
  const srFlat = typeof l.situationRead === 'string' ? l.situationRead : (typeof ba.situationRead === 'string' ? ba.situationRead : '');
  const gc = l.growthConstraint || ba.growthConstraint || null;
  const t = (l.theOneThing && typeof l.theOneThing === 'object') ? l.theOneThing : null;
  const arr = (x) => (Array.isArray(x) ? x : []);
  return {
    // WHO
    company: l.name || l.company || 'Unknown business',
    website: l.website || '',
    owner: l.verifiedCEO || l.founderName || '',
    ownerTitle: l.verifiedCEOTitle || l.title || '',
    email: l.email || '',
    phone: l.phoneDisplay || l.phone || '',
    location: l.location || '',
    trade: l.tradeWord || l.industry || '',
    icpScore: Number.isFinite(Number(l.icpScore)) ? Number(l.icpScore) : null,
    status: l.approved ? 'approved' : (l.pitch ? 'email written' : (ba.situationRead || l.problemList ? 'audited' : 'not audited')),
    // WHAT IT IS
    background: (sr && sr.background) || '',
    // THE ONE THING
    oneThing: t ? {
      layer: t.layer || '', diagnosis: t.diagnosis || '', why: t.why || '',
      firstBrokenLink: t.firstBrokenLink || '', firstBrokenLinkWhy: t.firstBrokenLinkWhy || '',
      earnedButBlocked: !!t.earnedButBlocked, frictionCount: Number(t.frictionCount) || 0,
      friction: arr(t.friction), costliest: t.costliest || null, product: t.product || '',
    } : null,
    // THE READ
    headline: (sr && sr.headline) || '',
    read: (sr && sr.read) || srFlat || '',
    rows: arr(sr && sr.rows).filter(r => r && (r.label || r.says)),
    bindingLayer: (gc && gc.layer) || '',
    // EVIDENCE
    originalFindings: arr(ba.originalFindings || l.originalFindings),
    problems: arr(l.problemList).map(p => ({ area: p.area || '', problem: p.problem || '', costs: p.costs || '', harm: p.harm })),
    // Called directly, not behind a `typeof` guard. buildAuditRows is a hoisted
    // module-scope declaration in this same script block, so a guard here could
    // only ever do one thing: silently empty this section if somebody moved the
    // function, which is precisely the vacuous pass this file keeps recording.
    signals: arr(buildAuditRows(l)).map(r => ({ label: r.label, val: r.val, ok: r.ok, proof: r.proof })),
    // THE CONVERSATION
    whatHeCaresAbout: (sr && sr.whatHeCaresAbout) || '',
    // ══ THE THREE THINGS A CALL NEEDS, ON THE SHEET SOMEBODY HOLDS ═════════
    // These went to the Call tab and not to the EXPORT, which is the artefact
    // that actually gets printed for a batch of fifty. The tab is for one lead
    // you are looking at; the export is for the fifty you are dialling.
    researchedAt: l.researchedAt || '',
    ageDays: l.researchedAt ? Math.floor((Date.now() - new Date(l.researchedAt).getTime()) / 86400000) : null,
    // ══ WHOSE WORLD THIS IS ════════════════════════════════════════════════
    // Vin's own hotel brief opens: "This is background, not a script. Knowing
    // these numbers isn't so you can present them; it's so you understand what
    // a GM means when he says his OTA mix is about half, and so you ask a
    // sharper next question." That is exactly the job this block does on the
    // sheet somebody is holding while they dial.
    //
    // The server decided what is in here. Nothing on this side reclassifies
    // anything: the sourced rows arrive already written about the SEGMENT, with
    // their citations attached, and they are rendered that way.
    niche: (() => {
      const n = l.nicheBrief || null;
      if (!n) return null;
      return {
        label: n.label || '', unit: n.unit || '', buyer: n.buyer || '',
        leakType: n.leakType || '', whatTheyDoNotHave: n.whatTheyDoNotHave || '',
        vocabulary: arr(n.vocabulary).filter(v => v && v.term),
        software: arr(n.software).filter(x => x && x.category),
        askOnCall: arr(n.askOnCall).filter(Boolean),
        sourced: arr(n.sourced).filter(x => x && x.say),
        verifiedAt: n.verifiedAt || '', ageDays: Number.isFinite(n.ageDays) ? n.ageDays : null,
      };
    })(),
    // ══ THE ONLY FACTS ON THIS SHEET WITH A DATE ═══════════════════════════
    // Everything else here is a photograph of the business as it is today. This
    // is what MOVED between two looks, and the server has already decided which
    // of them may be said out loud to the owner and which are ours to know. The
    // sentence is assembled here, where the lead is, so the renderer never has
    // to know what a lead is.
    changes: (() => {
      const wc = l.whatChanged || null;
      const ord = (n) => { const x = Math.round(Number(n)); if (!Number.isFinite(x)) return ''; const a = ((x % 100) + 100) % 100, b = ((x % 10) + 10) % 10; return x + ((a >= 11 && a <= 13) ? 'th' : b === 1 ? 'st' : b === 2 ? 'nd' : b === 3 ? 'rd' : 'th'); };
      return arr(wc && wc.changes).map(c => {
        if (c.id === 'rank_slipped') return { say: `${c.days} days ago they came up ${ord(c.from)} for "${c.phrase}". The same search today puts them ${ord(c.to)}.`, sayable: true };
        if (c.id === 'ads_started') return { say: `A Google Ads conversion tag appeared on their homepage in the last ${c.days} days. It was not there when we looked before.`, sayable: true };
        if (c.id === 'review_pace') return { say: `Reviews arrived at about ${c.perMonth} a month over the last ${c.days} days (${c.from} to ${c.to}).`, sayable: false };
        if (c.id === 'weaker_above_grew') return { say: `Businesses above them with fewer reviews went from ${c.from} to ${c.to} in ${c.days} days.`, sayable: false };
        if (c.id === 'ads_stopped') return { say: String(c.note || ''), sayable: false };
        if (c.id === 'rank_incomparable') return { say: String(c.note || ''), sayable: false };
        return null;
      }).filter(Boolean);
    })(),
    callWindow: (l.callWindow && l.callWindow.checked && l.callWindow.say) ? l.callWindow.say : '',
    expectObjection: (() => {
      const sim = (l.generatedResult && l.generatedResult.prospectSim) || l.prospectSim || null;
      const said = String((sim && (sim.reason || sim.why || sim.reaction)) || '').trim();
      return said.length >= 25 ? said.slice(0, 300) : '';
    })(),
    whatHeNeeds: (sr && sr.whatHeNeeds) || '',
    // Positive-only advertising evidence, and the pages the site links nowhere.
    // Both INTERNAL: the negative form of either is barred, so neither is ever
    // phrased as an absence in anything that leaves the building.
    adsVerified: !!(l.adsTransparency && l.adsTransparency.found),
    unlinkedPages: ((l.sitePages && l.sitePages.unlinkedPages) || {}).pages || [],
    unlinkedCount: ((l.sitePages && l.sitePages.unlinkedPages) || {}).unlinkedCount || 0,
    askOnTheCall: (sr && sr.askOnTheCall) || '',
    // WHAT NOT TO SAY. Carried deliberately: an exported audit that drops the
    // fact-check is an audit somebody repeats on a call believing all of it.
    criticalFactCheck: arr(l._criticalFactCheck),
    claimRisks: arr(l._claimRisks),
    // THE EMAIL, if one exists, so the caller can open on what was actually asked.
    subject: l.subject || '',
    pitch: l.pitch || '',
    renders: arr(l.pageShots).map(s => ({ label: s.label || s.key || 'page', url: s.shot || s.url || '' })).filter(s => s.url),
  };
};

// Renders records to one self-contained page. Knows nothing about leads, which
// is the point — everything it can say about an audit came from auditRecordFor.
const auditExportHtml = (records, meta) => {
  const m = meta || {};
  // Escaping is not a detail here. A business called "Smith & Sons <Roofing>"
  // silently destroys an unescaped page, and half the file after it.
  const e = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const p = (s) => e(s).replace(/\n/g, '<br>');
  const sec = (title, body) => body ? '<section><h3>' + e(title) + '</h3>' + body + '</section>' : '';
  const ul = (items, fn) => items.length ? '<ul>' + items.map(fn).join('') + '</ul>' : '';
  const one = (r, i) => {
    const t = r.oneThing;
    return '<article id="a' + i + '">'
      + '<header><h2>' + e(r.company) + '</h2><div class="meta">'
      + [r.trade, r.location, r.owner ? e(r.owner) + (r.ownerTitle ? ', ' + e(r.ownerTitle) : '') : '',
         r.phone, r.email, r.website].filter(Boolean).map(e).join(' &middot; ')
      + '</div><div class="pill">' + e(r.status) + (r.icpScore != null ? ' &middot; score ' + r.icpScore : '') + '</div></header>'
      + sec('What this business is', r.background ? '<p>' + p(r.background) + '</p>' : '')
      + (t ? '<section class="one"><h3>The one thing' + (t.layer ? ' &mdash; ' + e(t.layer) : '') + '</h3>'
          + (t.diagnosis ? '<p class="big">' + p(t.diagnosis) + '</p>' : '')
          + (t.why ? '<p class="dim">' + p(t.why) + '</p>' : '')
          + (t.firstBrokenLinkWhy ? '<h4>Fix this first' + (t.firstBrokenLink ? ' &mdash; ' + e(t.firstBrokenLink) : '') + '</h4><p>' + p(t.firstBrokenLinkWhy) + '</p>' : '')
          + (t.friction.length ? '<h4>' + (t.earnedButBlocked ? 'Earned, and blocked &mdash; ' : '') + t.frictionCount + ' thing(s) between interested and booked</h4>' + ul(t.friction, x => '<li>' + p(x) + '</li>') : '')
          + (t.costliest && t.costliest.problem ? '<h4>Costing them most</h4><p>' + p(t.costliest.problem) + (t.costliest.costs ? '. ' + p(t.costliest.costs) : '') + '</p>' : '')
          + '</section>' : '')
      + sec('What is actually going on here',
          (r.headline ? '<p class="big">' + p(r.headline) + '</p>' : '')
          + (r.read ? '<p>' + p(r.read) + '</p>' : '')
          + (r.bindingLayer ? '<p class="dim">Binding layer: ' + e(r.bindingLayer) + '</p>' : '')
          + ul(r.rows, x => '<li><b>' + e(x.label) + '</b> &mdash; ' + p(x.says) + '</li>'))
      + sec('What we found by reading their pages',
          ul(r.originalFindings, f => '<li>' + p(f.finding || f.what || f) + (f.quote ? '<br><q>' + p(f.quote) + '</q>' : '') + '</li>'))
      + sec('What is broken, worst first',
          r.problems.length ? '<table><tr><th>Area</th><th>Problem</th><th>What it costs</th></tr>'
            + r.problems.map(x => '<tr><td>' + e(x.area) + '</td><td>' + p(x.problem) + '</td><td>' + p(x.costs) + '</td></tr>').join('') + '</table>' : '')
      + sec('Where their ad clicks might land',
          (r.unlinkedCount ? '<p class="dim">' + r.unlinkedCount + ' page(s) their own navigation does not link to. A page built for an ad is not in the menu by design. Their absence would prove nothing.</p>' + ul(r.unlinkedPages, x => '<li>' + e(x) + '</li>') : '')
          + (r.adsVerified ? '<p>Listed as a verified advertiser in Google\'s Ads Transparency Center.</p>' : ''))
      + sec('What he clearly cares about', r.whatHeCaresAbout ? '<p>' + p(r.whatHeCaresAbout) + '</p>' : '')
      + (r.niche ? sec('Their world',
          '<p class="dim">Background on the segment, not a measurement of this business. None of it is a claim about them and none of it is in the email.</p>'
          + '<p><b>' + e(r.niche.label) + '</b></p>'
          + (r.niche.unit ? '<p>The unit of business: ' + p(r.niche.unit) + '</p>' : '')
          + (r.niche.buyer ? '<p>Who buys: ' + p(r.niche.buyer) + '</p>' : '')
          + (r.niche.whatTheyDoNotHave ? '<p>What this kind of business does not have: ' + p(r.niche.whatTheyDoNotHave) + '</p>' : '')
          + (r.niche.leakType ? '<p>Where the margin usually leaks: ' + p(r.niche.leakType) + '</p>' : '')
          + (r.niche.vocabulary.length ? '<h4>Their words</h4><table class="sig">' + r.niche.vocabulary.map(v =>
              '<tr><td>' + e(v.term) + '</td><td>' + p(v.means || '') + '</td></tr>').join('') + '</table>' : '')
          + (r.niche.software.length ? '<h4>Ask which of these they run</h4>' + ul(r.niche.software, x =>
              '<li>' + e(x.category) + ': ' + e((x.products || []).join(', ')) + '</li>')
              + '<p class="dim">We did not check. Asking is a diagnostic that costs nothing; asserting one would be a guess.</p>' : '')
          + (r.niche.sourced.length ? '<h4>Published figures for the segment</h4>' + ul(r.niche.sourced, x =>
              '<li>' + p(x.say) + ' <span class="dim">[' + e(x.source || '') + ', ' + e(x.at || '') + ']</span></li>')
              + '<p class="dim">These describe the category. Not one of them is a measurement of this business, and saying one as if it were is the fastest way to lose an operator who knows his own numbers.</p>' : '')
          + (r.niche.askOnCall.length ? '<h4>Questions worth asking</h4>' + ul(r.niche.askOnCall, q => '<li>' + p(q) + '</li>') : '')
          + (r.niche.ageDays !== null && r.niche.ageDays > 540
              ? '<p class="dim">This brief was verified ' + e(r.niche.verifiedAt) + ', over eighteen months ago. Re-check any figure before saying it out loud.</p>'
              : (r.niche.verifiedAt ? '<p class="dim">Verified ' + e(r.niche.verifiedAt) + '.</p>' : ''))
        ) : '')
      + sec('What changed since we last looked',
          (r.changes || []).length
            ? '<ul>' + (r.changes || []).map(c => '<li>' + p(c.say) + (c.sayable ? '' : ' <span class="dim">(ours to know, not his to hear)</span>') + '</li>').join('') + '</ul>'
              + '<p class="dim">These are the only facts on this sheet with a date attached. Everything else is how the business looks today.</p>'
            : '')
      + sec('Before you dial',
          (r.callWindow ? '<p>' + p(r.callWindow) + '</p>' : '')
          + (r.expectObjection ? '<p><b>Expect to hear:</b> <q>' + p(r.expectObjection) + '</q> That is our own prospect model reading this as the owner. Have an answer ready.</p>' : '')
          + (r.ageDays === null ? ''
             : r.ageDays <= 1
             ? '<p class="dim">Measured today. Everything above is current.</p>'
             : '<p class="dim"><b>Measured ' + r.ageDays + ' days ago.</b> Re-check the search position and the review count before saying either out loud. Both move, and being wrong about one ends the call.</p>'))
      + sec('What is actually worth selling them',
          (r.whatHeNeeds ? '<p>' + p(r.whatHeNeeds) + '</p>' : '')
          + (r.askOnTheCall ? '<p class="ask"><b>Ask before pitching:</b> ' + p(r.askOnTheCall) + '</p>' : ''))
      // ══ THE SIGNAL TABLE IS GONE FROM THE EXPORT, ON PURPOSE ══════════════
      // It went in two steps. First the provenance column left — useful while
      // debugging the machine, noise on a sheet somebody is holding during a
      // cold call. Then the table itself, because what remained was a column of
      // "Not checked" rows next to a handful of numbers that the prose sections
      // above already say better: "176 reviews at 4.8, third of twenty" belongs
      // in the read, not in a grid the caller has to interpret mid-dial.
      //
      // The signals are STILL COMPUTED and still on the audit screen, where
      // reading a grid is what you are there to do. auditRecordFor keeps
      // carrying them so nothing downstream loses a measurement — this is a
      // rendering decision about one artefact, not a deletion.
      + sec('Do not say', ul(r.claimRisks.concat(r.criticalFactCheck), x => '<li>' + p(typeof x === 'string' ? x : (x.what || JSON.stringify(x))) + '</li>'))
      + sec('The email as written', r.pitch ? '<p class="dim">Subject: ' + p(r.subject) + '</p><pre>' + p(r.pitch) + '</pre>' : '')
      + sec('Full-page renders', ul(r.renders, s => '<li>' + e(s.label) + ': <a href="' + e(s.url) + '">' + e(s.url) + '</a></li>'))
      + '</article>';
  };
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>' + e(m.title || 'CROJungle audits') + '</title><style>'

    + 'h4{font-size:12px;margin:14px 0 4px;color:#374151}p{margin:0 0 8px}.big{font-size:17px;font-weight:600}.dim{color:#6b7280;font-size:13px}'
    + 'article{padding:26px 0;border-top:3px solid #16181d}article:first-of-type{border-top:none}header .meta{color:#6b7280;font-size:13px;margin-bottom:6px}'
    + '.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#eef2ff;color:#4338ca}'
    + '.one{background:#f5f6ff;border-left:3px solid #6366f1;padding:2px 16px 12px;border-radius:6px}.one h3{border-bottom:none;color:#4338ca}'

    + 'td{border-bottom:1px solid #f0f1f3;padding:7px 8px 7px 0;vertical-align:top}.sig td:first-child{width:170px;color:#374151}.good{color:#15803d}.bad{color:#b91c1c}'
    + 'ul{margin:0 0 8px;padding-left:20px}li{margin-bottom:4px}q{color:#374151;font-style:italic}pre{white-space:pre-wrap;font:13px/1.6 inherit;background:#f7f8fa;padding:12px;border-radius:6px}'
    + '.ask{background:#fffbeb;padding:8px 10px;border-radius:5px}nav{font-size:13px;margin-bottom:20px;columns:2}nav a{color:#4338ca;text-decoration:none}'
    + '@media print{body{padding:0;max-width:none}article{break-after:page;border-top:none}nav{display:none}}'
    + '</style></head><body>'
    + '<h1>' + e(m.title || 'CROJungle audits') + '</h1>'
    + '<p class="dim">' + records.length + ' audit(s) &middot; exported ' + e(m.at || '') + '</p>'
    + (records.length > 1 ? '<nav>' + records.map((r, i) => '<div><a href="#a' + i + '">' + e(r.company) + '</a></div>').join('') + '</nav>' : '')
    + records.map(one).join('')
    + '</body></html>';
};

// The download itself. A blob rather than a data: URI because fifty audits run
// to megabytes and a data: URI of that size is refused by some browsers.
const downloadAudits = (leads, title) => {
  // ══ ONE BAD LEAD MUST NOT COST YOU FORTY-NINE GOOD ONES ══════════════════
  // This was a bare .map, so a single lead with an unexpected shape threw and
  // the whole export produced nothing — no file, and no indication which lead
  // was responsible. At one audit that is a visible error. At fifty, after two
  // hours of research and real money, it is the entire batch.
  //
  // Found by running the real export over a lead whose localVisibility came from
  // an older build: buildAuditRows read lv.results[0] with no guard and threw.
  // That guard is fixed, and this is the answer to the NEXT one.
  //
  // The failure is not swallowed. It becomes a row in the file naming the lead
  // and the error, so the batch survives and the defect is still visible.
  const records = [];
  const _broken = [];
  for (const l of (leads || [])) {
    try { records.push(auditRecordFor(l)); }
    catch (err) {
      _broken.push({ name: (l && l.name) || '(unnamed lead)', why: (err && err.message) || String(err) });
      console.log('audit export: skipped ' + ((l && l.name) || 'a lead') + ' — ' + ((err && err.message) || err));
    }
  }
  if (_broken.length) {
    records.push({
      company: _broken.length + ' audit(s) could not be rendered',
      headline: 'These leads are in the batch but their stored audit has a shape this export could not read.',
      background: _broken.map(b => b.name + ': ' + b.why).join(' | '),
      rows: [], problems: [], originalFindings: [], signals: [], claimRisks: [], criticalFactCheck: [],
      renders: [], unlinkedPages: [], read: '', whatHeNeeds: '', whatHeCaresAbout: '', askOnTheCall: '',
      callWindow: '', expectObjection: '', researchedAt: '', ageDays: null, adsVerified: false,
      unlinkedCount: 0, pitch: '', subject: '',
    });
  }
  if (!records.length) return 0;
  const at = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  const html = auditExportHtml(records, { title: title || 'CROJungle audits', at });
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'crojungle-audits-' + new Date().toISOString().slice(0, 10) + '-' + records.length + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Revoking immediately cancels the download in some browsers.
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return records.length;
};

// Which leads a batch would take, in the order it would take them. Separated
// from the runner so the button can say "42 ready" before anything is spent,
// and so the rule is in one place rather than inside a click handler.
//
// Already-researched leads are skipped by default: re-auditing a lead costs a
// full research cycle and the app has no way to know it would come back
// different. "Include re-runs" is a deliberate choice, not the default.
const batchCandidates = (allLeads, o) => {
  const opts = o || {};
  const limit = Math.max(1, Number(opts.limit) || BATCH_DEFAULT_SIZE);
  const includeDone = !!opts.includeResearched;
  return (allLeads || [])
    .filter((l) => l && l.id)
    .filter((l) => !l.notAFit)
    // A lead with no website has nothing to audit — leadChannel 'call' routes it
    // to the phone, and spending a research cycle on it returns an empty read.
    .filter((l) => (l.website || '').trim() || l.leadChannel === 'rebuild')
    .filter((l) => includeDone || !(l.status === 'researched' || l.status === 'generated' || l.status === 'approved' || l.status === 'sent'))
    .slice()
    .sort((a, b) => (b.icpScore || 0) - (a.icpScore || 0))
    .slice(0, limit);
};

// The polling half, on its own so a resumed run uses the identical code path.
const pollResearchJob = async (jobId, o) => {

  // Poll gently. The server abandons a run past 8 minutes and reports it as an
  // error, so this loop cannot spin forever even if the job never settles.
  const started = Date.now();
  // ══ THE CLIENT'S CLOCK CONTRADICTED THE SERVER'S ═════════════════════════
  // This gave up ten minutes after SUBMITTING. The server's clock starts when
  // the WORK starts — its own comment says so: "The work begins HERE, so the
  // timeout begins here too", because a job that waited six minutes for a slot
  // used to have two minutes left to do five minutes of work and was killed
  // with the credits already spent.
  //
  // So a lead that queued for five minutes and then worked for five was
  // abandoned HERE, by the browser, at the exact moment the server was about to
  // answer. It comes back as "Research did not finish within 10 minutes",
  // which reads as a slow lead rather than as a queue, and the audit that was
  // paid for is thrown away. With one lead at a time nothing ever queued and
  // this was invisible. Running fifty at a time it is the normal case.
  //
  // Two clocks now, both from the server's own report: give up after ten
  // minutes of WORK (the server abandons its own job at eight, so this can only
  // fire if the server has stopped answering), and a wall-clock backstop for a
  // server that never replies at all. An older server that does not report
  // workedMs falls back to the previous behaviour exactly.
  const WORK_STOP = 10 * 60 * 1000;
  const TOTAL_STOP = 90 * 60 * 1000;
  let workedMs = 0;
  while (Date.now() - started < TOTAL_STOP && workedMs < WORK_STOP) {
    if (o.signal && o.signal.aborted) throw new DOMException('Aborted', 'AbortError');
    await new Promise(r => setTimeout(r, 3000));
    let poll;
    try {
      poll = await fetch(BACKEND + '/api/research-job/' + jobId, { signal: o.signal });
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      continue;   // transient network blip — the job is still running server-side
    }
    const st = await poll.json().catch(() => ({}));
    if (poll.status === 404 || st.status === 'gone') {
      return { ok: false, status: 503, json: async () => ({ brainFailed: true, reason: st.error || 'The server restarted while this lead was being researched. Re-run Research.' }) };
    }
    if (st.status === 'running') {
      // A queued job has done no work yet, so it burns none of the work clock.
      workedMs = Number.isFinite(Number(st.workedMs))
        ? Number(st.workedMs)
        : (st.phase === 'queued' ? 0 : (Date.now() - started));
      if (typeof o.onProgress === 'function') o.onProgress(st.elapsedMs || (Date.now() - started));
      continue;
    }
    if (st.status === 'error' && !st.result) {
      return { ok: false, status: st.httpStatus || 500, json: async () => ({ brainFailed: true, reason: st.error || 'Research failed.' }) };
    }
    // Done. Hand back the payload with the status the sync route would have used,
    // so the 422 brainFailed branch behaves exactly as before.
    const status = st.httpStatus || 200;
    return { ok: status >= 200 && status < 300, status, json: async () => st.result || {} };
  }
  return { ok: false, status: 504, json: async () => ({ brainFailed: true, reason: workedMs >= WORK_STOP
    ? 'The server worked on this lead for over ten minutes without finishing, which is past its own abandon point. Re-run this lead.'
    : 'This lead was waiting in the queue for an hour and a half and never started. Something is holding the server\u2019s research slots. Re-run this lead.' }) };
};

const proxyFetch = async url => {
  const r = await fetch(CF_PROXY + encodeURIComponent(url));
  return r.text();
};
const LK = 'cj_leads_v3';
const SK = 'cj_settings_v3';
// Free fallback when Hunter credits run out or find nothing: build the most
// likely email from the decision-maker's name + domain. NOT verified — but a
// firstname.lastname@domain guess is right most of the time, and sending is free.
const guessEmailFromName = (fullName, website) => {
  if (!fullName || !website) return '';
  const domain = website.replace(/https?:\/\//, '').replace(/\/.*/, '').replace('www.', '');
  const parts = String(fullName).trim().toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/).filter(Boolean);
  if (parts.length < 2 || !domain) return '';
  return parts[0] + '.' + parts[parts.length - 1] + '@' + domain;
};

// ══ THE WORKING COPY LIVES IN MEMORY, NOT IN localStorage ═══════════════════
// ROOT CAUSE OF THE VANISHING LEADS, AND OF MY LAST THREE FAILED FIXES.
//
// getLeads() re-read and re-parsed localStorage on every call — 44 call sites,
// including the research merge, the list render and saveLeads itself. That was
// survivable while the pipeline was small. At 153 leads carrying full audits it
// is not: the payload exceeds the ~5MB origin quota, setItem throws, and the
// degradation path I added CLEARS the key.
//
// So localStorage held ONE lead while Supabase held 153, and the console said so:
//   Supabase: loaded 153 cloud leads -> UI updated
//   localStorage too small for this pipeline - running from Supabase only
//   localStorage leads: 1
//
// From that moment every read returned an almost-empty array. A research run
// would finish, read ~1 lead, fail to find its own id, patch, write, blow the
// quota again, and the store would be cleared. Three concurrent runs, one
// survivor — not a race between them, but each one destroying the store the
// others depended on. Every "disappearing lead" traces to this single line.
//
// The store is now a module-level array. localStorage becomes what it always
// should have been: a best-effort cache to survive a refresh, never the thing
// the app reads from. Supabase remains the durable truth. A cache that cannot
// hold everything is fine; a SOURCE that cannot is fatal, and it was the source.
let _leadsMem = null;

// ══ ONE PREDICTOR, USED BY BOTH PATHS ═══════════════════════════════════════
// This lived inside the Find handler, so only newly discovered leads were ever
// scored. Combined with reachPredict never being persisted, that meant PREDICT
// CHECK reported "no prediction was sent \u2014 LEGACY LEAD" on twelve of twelve
// leads across twelve runs, including ones discovered minutes earlier.
//
// It is a pure function of the business name and the website, both of which every
// lead carries, so there is no reason it could not run anywhere. Hoisting it means
// the research path can backfill a missing prediction using the SAME code rather
// than a second copy \u2014 two implementations of one rule is the mistake that
// produced the two merge paths and the two fabrication lists in this file.
const _CORP = /\b(insurance|agency|agencies|group|services|solutions|associates|partners|company|inc|llc|corp|co|the|of|and|advisors|advisory|consulting|management|holdings|enterprises|systems|center|centre|restoration|roofing|plumbing|heating|air|construction|realty|dental|medical|clinic|care|law|firm)\b/gi;
const _NONNAME = /\b(american|national|united|first|premier|elite|quality|choice|select|direct|express|advantage|independent|local|community|heritage|liberty|freedom|security|trust|guardian|shield|summit|pinnacle|apex|prime|superior|reliable|affordable|budget|value|smart|easy|simple|fast|quick|best|top|great|good|new|modern|future|next|global|world|international|state|county|city|north|south|east|west|central|midwest|southeast|northwest|kentucky|tennessee|florida|virginia|ohio|indiana|texas|georgia|carolina|louisville|nashville|tampa|richmond|lexington|atlanta|phoenix|denver)\b/gi;
const predictReach = (name, website) => {
  if (!name) return { score: 0, why: 'no name' };
  const core = String(name).replace(/[.,]/g,' ').replace(_CORP,' ').replace(_NONNAME,' ').replace(/\s+/g,' ').trim();
  const left = core.split(' ').filter(w => w.length > 2 && /^[A-Za-z'\-]+$/.test(w));
  const hyphen = /\b[A-Z][a-z]{2,}-[A-Z][a-z]{2,}\b/.test(name);
  const poss = /\b[A-Z][a-z]+'s\b/.test(name);
  const initial = /\b[A-Z][a-z]+\s+[A-Z]\.\s+[A-Z][a-z]+/.test(name);
  let sc = 0, why = [];
  if (initial)          { sc += 30; why.push('full personal name with initial'); }
  else if (hyphen)      { sc += 24; why.push('hyphenated surname pair — likely a partnership'); }
  else if (poss)        { sc += 22; why.push('possessive personal name'); }
  else if (left.length >= 2) { sc += 22; why.push('likely a personal name (' + left.slice(0,2).join(' ') + ')'); }
  // A single leftover word is ambiguous: it might be a surname ("Schwartz",
  // "Robins") or a brand ("Artist", "Demand"). Worth something, but not enough
  // on its own — a domain match below is what confirms it.
  else if (left.length === 1){ sc += 16; why.push('single distinctive word (' + left[0] + ') — could be a surname'); }
  else                  { why.push('generic institutional name — the owner is behind a brand'); }
  if (website && left.length) {
    try {
      const host = new URL(website).hostname.replace('www.','').split('.')[0].toLowerCase();
      if (left.some(w => host.includes(w.toLowerCase()))) { sc += 10; why.push('personal name appears in the domain'); }
    } catch (e) {}
  }
  return { score: Math.min(sc, 40), why: why.join('; ') };
};

// ══ THE PERSISTENCE LEAK, CAUGHT AUTOMATICALLY FROM NOW ON ═══════════════════
// This exact bug has now been found three times by hand: reachPredict, then
// verifiedCEO, discoverySignals, icpProfile, buyingLane and manualCategories.
// Every one had the same shape — computed at Find time, held in memory, sent to
// research, and never written to leadToRow. Invisible in a single session and
// fatal after any reload, which is every session here because the pipeline loads
// from Supabase at boot.
//
// It is invisible because nothing fails. The field is simply undefined, and the
// consumer treats undefined as "no signal" rather than "we lost it". PREDICT
// CHECK printed "LEGACY LEAD" on twelve of twelve leads for months and read as a
// note about old data rather than a defect.
//
// So: after the first save of a session, compare what a lead HAS against what
// survives the round trip, and name anything that would be silently dropped.
// Runs once, costs nothing, and turns a class of bug that took three manual
// audits to find into a console line.
let _persistAudited = false;
const auditPersistence = (lead) => {
  if (_persistAudited || !lead) return;
  _persistAudited = true;
  try {
    const round = rowToLead(leadToRow(lead));
    const SKIP = new Set(['id', 'updatedAt', 'createdAt', '_persisted']);
    const lost = Object.keys(lead).filter(k => {
      if (SKIP.has(k)) return false;
      const before = lead[k];
      if (before === null || before === undefined || before === '') return false;
      if (Array.isArray(before) && !before.length) return false;
      const after = round[k];
      return after === null || after === undefined;
    });
    if (lost.length) {
      console.warn('PERSISTENCE LEAK — these fields exist on the lead in memory and do NOT survive a save and reload: '
        + lost.join(', ')
        + '. They will read as absent on every lead loaded from the cloud, which is all of them after a refresh. Add each to leadToRow._persisted and rowToLead.');
    }
  } catch (e) { void e; }
};

// ══ THE RICH STRATEGIC READ LOSES TO ITS OWN SUMMARY ON EVERY RELOAD ════════
// Two different things are called situationRead and they are not the same shape.
//
//   brain_audit.situationRead  — ONE SENTENCE. The audit brain writes it as a
//     thinking step, deliberately, so that it reasons about the whole business
//     before choosing findings. The server's own comment on that field says
//     "Nothing reads parsed.situationRead."
//   _persisted.situationRead   — THE OBJECT. Written by a separate, larger model
//     AFTER the audit: {shape, background, headline, read, rows, whatHeNeeds,
//     askOnTheCall}. This is the strategic read — the 3-5 sentence diagnosis,
//     the character rows, the closing recommendation, and the one diagnostic
//     question the whole system generates for a salesperson.
//
// rowToLead read the one-sentence string FIRST, and `??` only falls through on
// null, so the summary won every time. The rich object survived exactly until
// the first page reload and was then silently replaced by its own summary.
//
// What that costs, all of it invisible: the briefing's read collapses to one
// line, the headline vanishes, the character rows vanish, "what is actually
// worth selling them" vanishes, and the call sheet's only question — "ask before
// pitching" — vanishes. The screen still renders, which is why this survived.
//
// Prefer the object. The discriminator is structural, not a flag: only the rich
// shape carries a read, a headline or rows.
const pickSituationRead = (flat, persisted) => {
  const isRich = (v) => !!(v && typeof v === 'object' && !Array.isArray(v)
    && (v.read || v.headline || (Array.isArray(v.rows) && v.rows.length)));
  if (isRich(persisted)) return persisted;
  if (isRich(flat)) return flat;
  // Neither is the strategic object. Keep whichever exists so a lead audited
  // before the synthesis call existed still shows its one sentence.
  return persisted ?? flat ?? null;
};

const getLeads = () => {
  if (Array.isArray(_leadsMem)) return _leadsMem;
  // First call of the session: hydrate from whatever the cache still holds. The
  // Supabase load replaces this within a second or two of boot.
  try {
    const raw = localStorage.getItem(LK);
    const parsed = raw ? JSON.parse(raw) : [];
    const arr = typeof parsed === 'string' ? (JSON.parse(parsed) || []) : parsed;
    _leadsMem = Array.isArray(arr) ? arr : [];
  } catch {
    _leadsMem = [];
  }
  return _leadsMem;
};

// Single writer for the in-memory store. Everything that changes leads goes
// through here, so there is one place where the working copy can be updated and
// one place where the cache is refreshed.
const setLeadsMem = (arr) => {
  _leadsMem = Array.isArray(arr) ? arr : [];
  cacheLeadsBestEffort(_leadsMem);
  return _leadsMem;
};

// Write to localStorage without ever letting it throw into the caller. Drops the
// two heaviest fields first, then gives up quietly — losing the cache costs a
// re-fetch on next load, which is nothing. Losing the working copy cost a day.
const cacheLeadsBestEffort = (arr) => {
  try {
    localStorage.setItem(LK, JSON.stringify(arr));
    window.__cjCache = { ok: true, mode: 'full', n: arr.length };

  // CLOUD SAVE FAILED banner was reporting. Not auth, not schema, not RLS — the
  // request was simply too big to process, and every lead in it failed together.
