          ? `${ahead} businesses come up before him when someone searches for ${trade ? 'a ' + trade : 'what he does'}${city ? ' in ' + city : ''}${weaker ? ` \u2014 ${weaker} of them have fewer reviews than he does` : ''}`
          : '';
      }],
      [/not in top|invisible|does not appear/i, () =>
        'He does not come up at all for services he publishes a page for \u2014 he paid to have those pages built and nobody looking for them finds him'],
      [/no business description|description missing/i, () =>
        'His Google listing has no description \u2014 the businesses above him filled theirs in'],
      [/(\d+)\s*photos?/i, (m) => Number(m[1]) < 10
        ? `Only ${m[1]} photos on his Google listing \u2014 someone choosing between three looks at the pictures first` : ''],
      [/no (online )?booking|booking.*not found|phone[- ]only/i, () =>
        'There is no way to book him from the site \u2014 someone ready to hire him has to phone during business hours'],
      [/(\d+)[- ]field form|form.*?(\d+)\s*fields?/i, (m) =>
        `Someone who wants to hire him has to fill in ${m[1] || m[2]} boxes before anyone replies`],
      [/no tap[- ]to[- ]call|tel.*missing/i, () =>
        'On a phone his number is not tappable \u2014 someone has to memorise it and dial by hand'],
      [/no guarantee|no clear offer|generic targeting/i, () =>
        'Nothing on his pages tells a stranger why him over the next name \u2014 so they decide on price'],
      [/no email[- ]capture|no capture/i, () =>
        'Nothing catches the person who is interested but not ready to call yet \u2014 they leave and he never knows they were there'],
      [/(\d+)\s*days? old|stale/i, (m) => m[1] && Number(m[1]) > 60
        ? `His newest review is ${m[1]} days old \u2014 the listing looks quieter than the business actually is` : ''],
      [/no CRM/i, () =>
        'Nothing on the page tracks who came and went, so he has no record of the people who nearly hired him'],
      [/copyright.*?(\d{4})/i, (m) =>
        `His footer still says ${m[1]} \u2014 anyone who scrolls to the bottom sees a site that looks abandoned`],
    ];
    const speak = (row) => {
      const src = [row.val, row.label, row.proof].filter(Boolean).join(' \u2014 ');
      for (const [re, out] of OWNER_VOICE) {
        const m = src.match(re);
        if (m) { const t = out(m, row); if (t) return t; }
      }
      // Unmatched: use the audit's own summary, which is already plain English.
      return row.val && String(row.val).length > 12 ? `${row.label}: ${row.val}` : '';
    };

    const seen = new Set(); const findings = [];
    const addFinding = (t) => {
      const v = String(t || '').replace(/\s+/g, ' ').trim();
      if (!v || v.length < 15) return;
      const k = v.toLowerCase().slice(0, 40);
      if (seen.has(k)) return; seen.add(k);
      findings.push(v);
    };

    // ── THE AUDIT'S OWN LIST, FIRST ────────────────────────────────────
    // The audit is explicitly told: "List EVERY finding you could plausibly lead
    // with \u2014 usually 3 to 6 \u2014 and score each one." So candidateFindings is the
    // complete picture, already written as sentences about the business and
    // already ranked. The LADDER narrows to one finding for the EMAIL; that is a
    // decision about what to open with, not a decision about what we know.
    //
    // Rebuilding this on the Research tab rows alone dropped these, which is
    // exactly the "audit gets cut short" problem \u2014 the sheet was reading the
    // dashboard summary instead of the findings behind it.
    //
    // Ordered by the binding layer first, then by the audit's own score.
    const LAYER_OF = { review_pattern: 'THROUGHPUT', positioning_offer: 'OFFER',
      search_absence: 'LEADS', gbp_gap: 'LEADS',
      conversion_leak: 'CONVERSION', technical_leak: 'CONVERSION', dated_site: 'CONVERSION' };
    const binding = (gc && gc.layer) || '';
    (lead.candidateFindings || []).slice()
      .sort((x, y) => {
        const xi = LAYER_OF[x.signal] === binding ? 1 : 0;
        const yi = LAYER_OF[y.signal] === binding ? 1 : 0;
        return (yi - xi) || ((y.total || 0) - (x.total || 0));
      })
      .forEach(c => addFinding(c.finding));
    // ── WHAT COUNTS AS A FINDING ───────────────────────────────────────
    // `ok` is NOT a problem flag \u2014 testing showed it is false for "Not checked"
    // and for "Profile looks complete" alike. So the value text decides.
    //
    // Two exclusions, both important. NOT CHECKED is a gap in OUR coverage and
    // says nothing about his business; presenting it as a finding would be the
    // same fabrication the whole system guards against. PASSING states are
    // things he is doing right \u2014 real, but not why you are phoning.
    const NOT_CHECKED = /^(not checked|not measured|not assessed|unknown|n\/a|\u2014|-)$/i;
    const PASSING = /\b(complete|recent|present|good|passed|fine|healthy|strong|clean|ok|no issues|none found|all good|looks (complete|good|fine))\b/i;
    rows.filter(r => {
      const v = String((r && r.val) || '').trim();
      if (!v || NOT_CHECKED.test(v)) return false;
      if (PASSING.test(v)) return false;
      return true;
    })
      .forEach(r => addFinding(speak(r)));
    // And the audit's written conclusions, which often say it better than a row.
    [ba.sharpestPain, ba.embarrassingFinding, lead.topPain && lead.topPain.pain,
     result && result.observation].forEach(addFinding);

    const JARGON = /\b(pixel|retargeting|conversion rate|funnel|CRM|SEO|schema|meta description|H1|above the fold|attribution|impressions|map[- ]pack|CTA|UX|bounce rate|landing page)\b/i;
    const clean = findings.filter(f => !JARGON.test(f)).slice(0, 12);

    // ── THE ONE NUMBER ─────────────────────────────────────────────────
    // The sharpest measured thing, said out loud. Rank first because he can
    // check it on his phone while you are talking.
    const numberLong = clean[0] || (result && result.observation
      ? String(result.observation).replace(/\s+/g, ' ').split(/(?<=\.)\s/)[0] : '');
    const number = numberLong
      ? (numberLong.length > 95 ? numberLong.slice(0, 92) + '\u2026' : numberLong) : '';

    const haveRealData = !!(clean.length || revs || numberLong);

    // ── THE BRIEF ──────────────────────────────────────────────────────
    // Who he is and what he has earned \u2014 what is broken \u2014 what it adds up to.
    // ══ MIKE GETS THE READ, NOT A TEMPLATE ══════════════════════════════════
    // The situation read is the strongest thing this system produces \u2014 three to
    // five sentences of synthesis across every measured signal, retried when it
    // fails a check. It reached the audit prompt and stopped there. The call
    // sheet, the one artefact a human actually reads before dialling, assembled
    // its own summary from string templates: "That reputation took years and it
    // is genuinely earned" is written identically for every lead in the pipeline.
    //
    // So the closer works from generated boilerplate while a real diagnosis sits
    // one field away \u2014 and the two can disagree. The sheet can say the reputation
    // is earned while the read says the business has no machine for turning
    // finished work into the next job.
    //
    // Where a read exists it IS the brief. The templates remain for leads audited
    // before it existed, and for the thin ones where the synthesis correctly
    // declined to guess rather than inventing something.
    const _sr = lead.situationRead || (lead.brainAudit && lead.brainAudit.situationRead) || null;
    const _srBrief = (_sr && _sr.read) ? [
      _sr.headline ? String(_sr.headline).trim() : '',
      String(_sr.read).trim(),
      // ══ WHERE HE WILL LEAN IN, AND WHERE HE WILL BRISTLE ═══════════════
      // Read from behaviour we measured — whether he answers his own reviews
      // and how he writes when he does, what he wrote about himself, what he is
      // hiring for. It goes ABOVE the recommendation on purpose: knowing what a
      // man cares about changes how you open, and the recommendation is what you
      // arrive at afterwards.
      _sr.whatHeCaresAbout ? `What he clearly cares about \u2014 ${String(_sr.whatHeCaresAbout).trim()}` : '',
      // ══ FIFTY COLD CALLS A DAY IS SIXTY SECONDS OF PREP EACH ═════════════
      // Three things that only matter on a phone call, and all three were being
      // computed and thrown away.
      //
      // HOW OLD IS THIS. A rank, a review count and a set of opening hours all
      // move. Asserting a three-week-old number to an owner who has since fixed
      // it ends the call. Nothing anywhere recorded when the audit was measured.
      (() => {
        if (!lead.researchedAt) return '';
        const days = Math.floor((Date.now() - new Date(lead.researchedAt).getTime()) / 86400000);
        if (!Number.isFinite(days)) return '';
        return days <= 1
          ? 'Measured today. Everything below is current.'
          : `Measured ${days} days ago. Re-check the search position and the review count before you say either out loud \u2014 both move, and being wrong about one is how this call ends.`;
      })(),
      // ══ WHOSE WORLD THIS IS ═════════════════════════════════════════════
      // Background on the segment. Vin's own brief for this says it best: it is
      // not so you can present the numbers, it is so you understand what the
      // owner means and can ask a sharper question. Rendered in that order —
      // what the business IS, then his words, then what to ASK.
      (() => {
        const n = lead.nicheBrief || null;
        if (!n) return '';
        const L = [];
        L.push(`Their world \u2014 ${n.label}`);
        if (n.unit) L.push(`\u2022 The unit of business: ${n.unit}`);
        if (n.whatTheyDoNotHave) L.push(`\u2022 What this kind of business does not have: ${n.whatTheyDoNotHave}`);
        if (n.leakType) L.push(`\u2022 Where the margin usually leaks: ${n.leakType}`);
        const vocab = (n.vocabulary || []).slice(0, 5);
        if (vocab.length) L.push(`\u2022 His words: ${vocab.map(v => `${v.term} (${v.means})`).join(' \u00b7 ')}`);
        const sw = (n.software || []).slice(0, 3);
        if (sw.length) L.push(`\u2022 Ask which he runs: ${sw.map(x => `${x.category} \u2014 ${(x.products || []).join(', ')}`).join(' \u00b7 ')}. We did not check, so ask; do not assert.`);
        for (const row of (n.sourced || []).slice(0, 4)) L.push(`\u2022 SEGMENT, not him: ${row.say} [${row.source}]`);
        for (const q of (n.askOnCall || []).slice(0, 3)) L.push(`\u2022 Worth asking: ${q}`);
        L.push('None of this is a measurement of this business and none of it is in the email. It is here so you follow what he means and ask a better next question.');
        return L.join('\n');
      })(),
      // ══ WHAT MOVED. THE ONLY DATED FACTS ON THIS SHEET ══════════════════
      // Every other line here describes the business as it is today. These come
      // from comparing this look against an earlier one, and they are the only
      // thing on the sheet that answers "why now". The server has already split
      // what may be said to the owner from what is ours to know, so the label
      // travels with the sentence and nobody has to remember the rule.
      (() => {
        const cs = ((lead.whatChanged && lead.whatChanged.changes) || []);
        if (!cs.length) return '';
        const ord = (n) => { const x = Math.round(Number(n)); if (!Number.isFinite(x)) return ''; const a = ((x % 100) + 100) % 100, b = ((x % 10) + 10) % 10; return x + ((a >= 11 && a <= 13) ? 'th' : b === 1 ? 'st' : b === 2 ? 'nd' : b === 3 ? 'rd' : 'th'); };
        const lines = cs.map(c => {
          if (c.id === 'rank_slipped') return `\u2022 ${c.days} days ago they came up ${ord(c.from)} for "${c.phrase}". The same search today puts them ${ord(c.to)}.`;
          if (c.id === 'ads_started') return `\u2022 A Google Ads conversion tag appeared on their homepage in the last ${c.days} days. It was not there before.`;
          if (c.id === 'review_pace') return `\u2022 OURS TO KNOW: reviews arrived at about ${c.perMonth} a month over the last ${c.days} days (${c.from} to ${c.to}).`;
          if (c.id === 'weaker_above_grew') return `\u2022 OURS TO KNOW: businesses above them with fewer reviews went from ${c.from} to ${c.to} in ${c.days} days.`;
          if (c.id === 'ads_stopped' || c.id === 'rank_incomparable') return `\u2022 OURS TO KNOW: ${String(c.note || '')}`;
          return '';
        }).filter(Boolean);
        return lines.length ? `What changed since we last looked\n${lines.join('\n')}` : '';
      })(),
      // WHEN TO DIAL, read from their own published hours and their trade.
      (lead.callWindow && lead.callWindow.checked && lead.callWindow.say)
        ? `When to call \u2014 ${lead.callWindow.say}` : '',
      // WHAT HE WILL SAY BACK. Our own prospect model already writes this in the
      // owner's register and it was only ever used as a pass/fail signal.
      (() => {
        const sim = (lead.generatedResult && lead.generatedResult.prospectSim) || lead.prospectSim || null;
        const said = String((sim && (sim.reason || sim.why || sim.reaction)) || '').trim();
        if (said.length < 25) return '';
        return `Expect to hear \u2014 "${said.slice(0, 300)}" That is our own prospect model reading this as the owner. Have an answer ready before you dial.`;
      })(),
      _sr.whatHeNeeds ? `What would actually help \u2014 ${String(_sr.whatHeNeeds).trim()}` : '',
      _sr.askOnTheCall ? `Ask before pitching \u2014 ${String(_sr.askOnTheCall).trim()}` : '',
    ].filter(Boolean).join('\n\n') : '';

    const brief = _srBrief || (!haveRealData
      ? `\u26a0 Nothing measured on this lead yet \u2014 no rank, no reviews, no listing data. Re-run Research before calling. Do NOT dial from this sheet as it stands.`
      : (() => {
        const S = [];
        S.push([
          firstN ? `${firstN} runs` : 'They run',
          revs ? `a ${revs}-review${rating ? `, ${rating}\u2605` : ''} ${trade || 'business'}`
               : (trade ? `a ${trade}` : 'this business'),
          city ? `in ${city}` : '',
        ].filter(Boolean).join(' ').trim() + '.'
          + (revs ? ' That reputation took years and it is genuinely earned.' : ''));
        if (numberLong) S.push(`What is not working: ${numberLong.charAt(0).toLowerCase() + numberLong.slice(1)}.`);
        if (clean.length >= 3) {
          S.push(revs
            ? `There are ${clean.length} of these, every one on his own site or listing. He is winning on reputation and losing on everything either side of it \u2014 which is why this is a conversation and not a to-do list.`
            : `There are ${clean.length} of these, every one on his own site or listing, and each sits between someone wanting to hire him and actually doing it.`);
        } else if (revs) S.push('He is winning on reputation and losing on what happens either side of it.');
        return S.join(' ');
      })());

    const example = !numberLong ? '' :
      `${firstN || 'Hi'}? It's [your name]. I went through your website, your reviews, where you come up on Google \u2014 and you do great work, the reviews say it. But your online presence isn't matching that, and I think it's costing you customers.\n\n${numberLong.charAt(0).toUpperCase() + numberLong.slice(1)}.\n\nThat's one of a few. Worth twenty minutes to go through the rest?`;

    return {
      who, firstN, phone: lead.phone || '', company: lead.name,
      trade: lead.industry || '', city,
      reviews: revs ? `${revs} reviews${rating ? ' at ' + rating : ''}` : '',
      brief, number, findings: clean, example, haveRealData,
      credit: revs ? `${revs} reviews${rating ? ' at ' + rating : ''}. He does great work and it shows.` : '',
    };
  }

// One call sheet, rendered the same way wherever it appears. GenerateView shows
// it inline while writing; the Call tab shows it after sending. Both go through
// callDataFor, so the two can never drift.
function CallSheetPanel({ lead, result }) {
  const d = callDataFor(lead, result || null);
  const H = (t) => React.createElement('div', {
    style: { fontSize: 10, fontWeight: 600, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--m)', marginBottom: 12 }
  }, t);
  const BEAT = (label, text, note) => React.createElement('div', {
    key: label, style: { display: 'flex', gap: 14, marginBottom: 10, alignItems: 'baseline' }
  },
    React.createElement('div', { style: { fontSize: 9, fontWeight: 600, letterSpacing: '.1em', color: 'var(--m)', minWidth: 48, flexShrink: 0 } }, label),
    React.createElement('div', { style: { flex: 1, fontSize: 14, lineHeight: 1.5, color: 'var(--t)' } },
      text, note && React.createElement('span', { style: { color: 'var(--m)' } }, ' ' + note)));

  return React.createElement('div', { style: { borderTop: '1px solid var(--b2)', paddingTop: 14 } },
    H('Read this first'),
    React.createElement('div', {
      style: { fontSize: 14, lineHeight: 1.7, marginBottom: 22,
        color: d.haveRealData ? 'var(--m2)' : 'var(--am)',
        padding: d.haveRealData ? 0 : '10px 12px',
        background: d.haveRealData ? 'transparent' : 'rgba(245,158,11,0.08)',
        borderLeft: d.haveRealData ? 'none' : '2px solid var(--am)' }
    }, d.brief),

    d.haveRealData && React.createElement('div', { style: { paddingTop: 18, borderTop: '1px solid var(--b2)' } }, H('Four beats')),
    d.haveRealData && d.credit && BEAT('CREDIT', d.credit),
    d.haveRealData && BEAT('GAP', 'His online presence is not matching the work he actually does.'),
    d.haveRealData && d.number && BEAT('NUMBER', d.number),
    d.haveRealData && BEAT('ASK', 'Twenty minutes to go through the rest.', '\u2014 then stop talking.'),

    d.example && React.createElement('div', { style: { marginTop: 22, paddingTop: 18, borderTop: '1px solid var(--b2)' } },
      H('How it sounds \u2014 an example, not a script'),
      React.createElement('div', {
        style: { fontSize: 14, lineHeight: 1.7, color: 'var(--m2)', whiteSpace: 'pre-wrap', paddingLeft: 14, borderLeft: '2px solid var(--b2)', fontStyle: 'italic' }
      }, d.example),
      React.createElement('div', { style: { fontSize: 11, color: 'var(--m)', marginTop: 8 } },
        'Do not read this aloud \u2014 a read line sounds read. It is here so you can hear the shape before you dial.')),

    d.findings.length > 0 && React.createElement('div', { style: { marginTop: 22, paddingTop: 18, borderTop: '1px solid var(--b2)' } },
      H('If he asks what else \u2014 everything we found'),
      d.findings.map((f, k) => React.createElement('div', {
        key: k, style: { fontSize: 13.5, lineHeight: 1.6, color: 'var(--m2)', padding: '5px 0 5px 14px', borderLeft: '2px solid var(--b2)', marginBottom: 4 }
      }, f))),

    React.createElement('div', { style: { marginTop: 18, paddingTop: 12, borderTop: '1px solid var(--b2)', fontSize: 11, lineHeight: 1.7, color: 'var(--m)' } },
      'Do not explain why you called until after the number \u00b7 never soften a fact with your motives \u00b7 one finding, the rest is the meeting')
  );
}

// ══ CALL ═════════════════════════════════════════════════════════════════════
// Sent leads only. The call happens AFTER the email lands \u2014 that is what makes
// it not a cold call ("I sent you a note Monday, did it land or go to spam?") \u2014
// and keeping these out of Generate removes any chance of sending the same email
// twice. Each row opens the same call sheet the Generate tab builds, from the
// same buildCallData, so there is one definition of what to say.
function CallView({ settings }) {
  // Same shape as LeadBriefing's prettyPhone. Duplicated deliberately rather
  // than hoisted to module scope: this file is a compiled single-scope bundle
  // with no import graph, and moving a helper out of a component is how the
  // last round of scope bugs got introduced.
  const fmtPhone = (p) => {
    const d = String(p || '').replace(/\D/g, '');
    if (d.length === 11 && d[0] === '1') return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
    if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
    return String(p || '');
  };
  const [leads, setLeads] = React.useState([]);
  const [callOnly, setCallOnly] = React.useState([]);
  const [openId, setOpenId] = React.useState(null);

  // ══ TWO KINDS OF CALL, AND ONE OF THEM HAD NOWHERE TO GO ══════════════════
  // This view filtered status === 'sent' \u2014 it is a follow-up-after-the-email
  // screen. That is a real and useful thing, and it is not the only kind of call.
  //
  // Philip J. Gauer and Andrew Wade both came out of Research with a complete
  // audit, an owner corroborated across four sources at the highest confidence
  // this system produces, and a dialable number on their Google listing. Their
  // mail servers genuinely refuse every mailbox, so they can never be emailed \u2014
  // which means they can never reach 'sent', which means they could never appear
  // here. Generate blocks them, Send blocks them, and this screen never saw them.
  // Fully researched leads falling out of the pipeline in silence.
  //
  // The reachability scorer already names this: outreachChannel 'phone', verdict
  // "Call lead \u2014 owner confirmed, no mailbox exists, work it by phone". Nothing
  // downstream had been taught to read it. So: two sections. Leads that can only
  // be called, first, because nobody else is looking at them; and the warm
  // follow-ups after a send, which is what this screen already did well.
  const [tab, setTab] = React.useState('call');

  const load = () => {
    const all = getLeads();

    // Researched, has a number, has no usable mailbox. The audit is finished and
    // just as good; it goes down the phone instead of the inbox.
    const callOnly = all
      .filter(l => {
        if (l.status === 'sent') return false;
        const hasAudit = !!(l.brainAudit || l.buckets);
        const hasPhone = !!String(l.phone || '').replace(/\D/g, '');
        const hasEmail = !!(l.email || (l.emailResult && l.emailResult.email));
        const owner = !!((l.decisionMaker && l.decisionMaker.name) || l.founderName || l.verifiedCEO);
        if (!hasAudit || !hasPhone || !owner) return false;
        // ── TWO REASONS A LEAD BELONGS ON THE PHONE ─────────────────────────
        // 1. No mailbox exists. We cannot email him at all.
        // 2. A mailbox exists, but nothing we found is worth a first email.
        //
        // The second is the one that keeps getting sent anyway, because the lead
        // cost money to research and the instinct is to use it. That is sunk cost.
        // Singler Law is the example: real online booking, a decent profile, a
        // clean site, nothing broken. The best thing we could open with is "you
        // rank tenth", which is the email every agency sends him. Spending his
        // only first impression on that is worse than not writing.
        //
        // On a call none of that matters. A human builds the case in conversation,
        // and "I had a look at your setup, a few things stood out" works fine out
        // loud in a way it does not in a cold inbox.
        // ── TOO_WEAK BELONGS HERE TOO ───────────────────────────────────────
        // Only CALL_INSTEAD was read, and there are two verdicts that mean "do
        // not open a cold email with this". TOO_WEAK is the one where the best
        // finding is a free twenty-minute fix — the server's own note on it says
        // "he reads it, does it himself, and never answers". Those leads had a
        // mailbox, so they were not routed here, and Generate happily wrote to
        // them: the whole reason an email can go out on "you have unanswered
        // reviews", which the owner fixes for free and thanks us for.
        const os = (l.brainAudit && l.brainAudit.openerStrength) || null;
        const weakOpener = !!(os && (os.verdict === 'CALL_INSTEAD' || os.verdict === 'TOO_WEAK'));
        return (!hasEmail || weakOpener);
      })
      .sort((a, b) => (b.icpScore || 0) - (a.icpScore || 0));
    setCallOnly(callOnly);

    const sent = all
      .filter(l => l.status === 'sent')
      .sort((a, b) => {
        // Freshest sends first \u2014 an email from this morning is a warm call; one
        // from last week is not.
        const at = Date.parse((a.sentSnapshot && a.sentSnapshot.sentAt) || a.sentAt || 0) || 0;
        const bt = Date.parse((b.sentSnapshot && b.sentSnapshot.sentAt) || b.sentAt || 0) || 0;
        return bt - at;
      });
    setLeads(sent);
  };
  React.useEffect(() => {
    load();
    const again = () => load();
    window.addEventListener('focus', again);
    const t = setInterval(again, 3000);
    return () => { window.removeEventListener('focus', again); clearInterval(t); };
  }, []);

  const daysSince = (l) => {
    const t = Date.parse((l.sentSnapshot && l.sentSnapshot.sentAt) || l.sentAt || 0);
    if (!t) return null;
    return Math.floor((Date.now() - t) / 86400000);
  };

  if (!leads.length && !callOnly.length) {
    return React.createElement('div', { style: { padding: 40, color: 'var(--m)' } },
