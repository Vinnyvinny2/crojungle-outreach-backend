# ═══════════════════════════════════════════════════════════════════════════
# EVERY GATE, ON EVERY CHANGE HEADED FOR MAIN.
#
# Until 2026-08-22 the gates only ran when somebody remembered to run them,
# which for the life of this project meant one person's terminal. This runs
# ci-gates.sh — the same single script a human runs — on every PR and on every
# push to main or staging, so a red build is VISIBLE on every merge. Honest
# limit: visibility is not enforcement — GitHub only BLOCKS a red merge once
# branch protection requires this check (one-time, PART 8 of CLAUDE.md).
# The workflow adds NOTHING of its own: the gate list lives in ci-gates.sh,
# one copy, and this file only invokes it.
#
# PR branches run once (the pull_request event), not twice — a push trigger on
# every branch would run the whole suite twice per push on an open PR. The
# concurrency group cancels a stale run when a newer push lands.
# ═══════════════════════════════════════════════════════════════════════════
name: gates
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify-split.sh reads the pre-split CLAUDE.md from history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash ci-gates.sh
